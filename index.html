<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f1f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training Log">
<meta name="description" content="A private workout log: flexible exercise logging, diary notes, progress charts and a built-in coach. Data stays in your browser.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Training Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column, five bottom tabs. Look: gym-floor signage (condensed numerals, chalk-gray ground, one blue). */
:root{
  --bg:#f1f2ee; --surface:#ffffff; --surface-2:#e8eae4; --ink:#14181b; --ink-2:#4b545b; --ink-3:#6f7980;
  --line:#d8dbd3; --grid:#e4e7e0; --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e3eefb;
  --good:#0f7a3a; --good-soft:#e1f3e8; --warn:#9a5200; --warn-soft:#fff0d8; --bad:#b3261e;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --text:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1214; --surface:#171b1e; --surface-2:#22282c; --ink:#eef1ee; --ink-2:#b7c0c5; --ink-3:#8c979e;
  --line:#2b3237; --grid:#242b30; --accent:#3987e5; --accent-ink:#04101e; --accent-soft:#16283d;
  --good:#52c882; --good-soft:#142a1d; --warn:#f0a443; --warn-soft:#2d2312; --bad:#ff8a80; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f1214; --surface:#171b1e; --surface-2:#22282c; --ink:#eef1ee; --ink-2:#b7c0c5; --ink-3:#8c979e;
  --line:#2b3237; --grid:#242b30; --accent:#3987e5; --accent-ink:#04101e; --accent-soft:#16283d;
  --good:#52c882; --good-soft:#142a1d; --warn:#f0a443; --warn-soft:#2d2312; --bad:#ff8a80; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
html{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--text);padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font:700 30px/1.05 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font:600 20px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0 0 10px;color:var(--ink-2)}
p{margin:0}
.sub{color:var(--ink-2);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;min-height:44px}
.brand{font:700 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
#sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
#sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
#sync[data-s="busy"]::before{background:var(--accent)} #sync[data-s="local"]::before{background:var(--warn)} #sync[data-s="err"]::before{background:var(--bad)}
main{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}

/* controls */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;min-height:46px;padding:0 18px;font-weight:600}
.btn.wide{width:100%}
.btn.out{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.link{background:none;border:0;color:var(--accent);padding:8px 2px;font-weight:600;min-height:40px}
.link.bad{color:var(--bad)}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-height:38px;padding:0 14px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.warn[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
input[type=text],input[type=date],textarea,select{width:100%;background:var(--surface-2);color:var(--ink);border:1.5px solid transparent;border-radius:10px;min-height:44px;padding:10px 12px;font:inherit}
textarea{min-height:96px;resize:vertical}
label.lbl{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;color:var(--ink-3);font-size:12px;font-weight:600;border-radius:10px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* week strip */
.strip{display:flex;align-items:center;gap:4px}
.strip .arrow{background:none;border:0;width:34px;min-height:56px;font-size:22px;color:var(--ink-2)}
.strip .d{flex:1;min-width:0;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink-2);font-weight:600}
.strip .d b{font:600 18px/1 var(--display);color:var(--ink)}
.strip .d[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.strip .d i{width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--line)}
.strip .d.on i{background:var(--good);border-color:var(--good)}
.strip .d.now b{color:var(--accent)}
.weekline{font-size:14px;color:var(--ink-2)} .weekline b{font:700 20px var(--display);color:var(--ink)}

/* plan cards */
.plan{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.plan .ltr{font:700 34px/1 var(--display);color:var(--accent);width:28px}
.plan strong{display:block;font-weight:600}
.plan small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}

/* exercise entries */
.ex h3{font:600 21px/1.1 var(--display);margin:0}
.ex .meta{font-size:13px;color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:7px 10px}
.hint b{color:var(--ink)}
.flag{font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:7px 10px;font-weight:500}
.pr{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--good);background:var(--good-soft);border-radius:6px;padding:2px 7px;text-transform:uppercase}
.set{display:flex;align-items:center;gap:8px}
.set .n{width:22px;text-align:center;font:600 18px var(--display);color:var(--ink-3)}
.set .fld{flex:1;min-width:0;position:relative;display:block}
.set .fld input{padding-right:34px;text-align:right;font:600 18px var(--display);min-height:46px}
.set .fld i{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;color:var(--ink-3);pointer-events:none}
.tick{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-3);flex:none}
.tick svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.set.ok .tick{background:var(--good);border-color:var(--good);color:#fff}
.set.ok .fld input{background:var(--good-soft)}
.x{width:30px;height:46px;background:none;border:0;color:var(--ink-3);font-size:20px;flex:none}
.exfoot{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}

/* stats / charts */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .k{font-size:12px;color:var(--ink-2);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tile .v{font:700 34px/1.05 var(--display);margin-top:2px}
.tile .s{font-size:12px;color:var(--ink-2)}
.readout{display:flex;align-items:baseline;gap:8px;min-height:30px}
.readout b{font:700 26px/1 var(--display)} .readout span{font-size:13px;color:var(--ink-2)}
svg.chart{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.c-grid{stroke:var(--grid);stroke-width:1}
.c-tick{fill:var(--ink-2);font:500 11px var(--text)}
.c-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.c-goal{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:5 4}
.c-goaltxt{fill:var(--ink-2);font:600 11px var(--text)}
.c-cross{stroke:var(--ink-3);stroke-width:1}
.c-bar{fill:var(--accent);opacity:.55} .c-bar.cur{opacity:1} .c-bar.hl{opacity:1}
.seg{display:flex;gap:6px}
.seg .chip{min-height:34px;padding:0 12px;font-size:13px}
details.tbl{margin-top:8px;font-size:13px} details.tbl summary{color:var(--accent);font-weight:600;cursor:pointer;min-height:32px;display:flex;align-items:center}
details.tbl table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
details.tbl td,details.tbl th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:500}
details.tbl th{color:var(--ink-2);font-size:12px}
.empty{color:var(--ink-2);font-size:14px;padding:18px 4px;text-align:center}

/* diary + chat */
.entry .date{font:600 19px var(--display);letter-spacing:.02em}
.entry .body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.badge{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2)}
.feel .chip{flex:1;padding:0 4px;min-width:0}
.bubble{border-radius:14px;padding:10px 13px;max-width:92%;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.bubble p+p,.bubble ul+p,.bubble p+ul{margin-top:8px} .bubble ul{margin:0;padding-left:20px}
.chat{display:flex;flex-direction:column;gap:10px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;height:46px;resize:none}

/* sheet */
#sheet:empty{display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.pick{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:52px;display:block}
.pick strong{font-weight:600} .pick small{display:block;color:var(--ink-2);font-size:12px} .pick em{font-style:normal;color:var(--warn);font-size:12px;font-weight:600}
.skel{height:84px;border-radius:14px;background:var(--surface-2);opacity:.7}
.note{font-size:13px;color:var(--ink-2)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:14px}
.done{background:var(--good-soft);color:var(--good);border-radius:12px;padding:12px 14px;font-weight:600}
@media (prefers-reduced-motion:no-preference){ .btn,.chip,.tick{transition:background .12s,border-color .12s} }
[hidden]{display:none!important}
.landing{min-height:calc(100dvh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:28px 0 8px}
.landing .logo svg{width:96px;height:96px;display:block}
.eyebrow{font:600 13px var(--text);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.hero{font:700 clamp(40px,12.5vw,58px)/.98 var(--display);text-transform:uppercase;max-width:11em;text-wrap:balance}
.landstats{display:flex;gap:10px;width:100%}
.landstats div{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.landstats b{display:block;font:700 30px/1 var(--display)} .landstats span{font-size:12px;color:var(--ink-2)}
.upnext{font-size:15px;color:var(--ink-2)} .upnext b{color:var(--ink);font-weight:600}
.btn.big{min-height:56px;font-size:18px;width:100%;letter-spacing:.01em}
.exname{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline dotted var(--ink-3);text-underline-offset:4px}
.prow{display:flex;gap:8px;align-items:stretch} .prow .pick{flex:1;min-width:0}
.info{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:56px;font-size:13px;font-weight:600;color:var(--accent)}
.bodies{display:flex;gap:8px;justify-content:center}
.bodies figure{margin:0;flex:1;min-width:0;max-width:190px;text-align:center}
.bodies figcaption{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
svg.body{display:block;width:100%;height:auto}
.bbase{fill:var(--surface-2)}
.m{fill:var(--surface);stroke:var(--line);stroke-width:.8}
.m.p{fill:var(--accent);stroke:var(--accent)}
.m.s{fill:var(--accent);fill-opacity:.38;stroke:var(--accent);stroke-opacity:.55}
.keys{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--ink-2)}
.keys i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px;border:1px solid var(--accent)}
.keys i.p{background:var(--accent)} .keys i.s{background:var(--accent);opacity:.38}
ol.steps,ul.watch{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
ol.steps li::marker{font-weight:700;color:var(--accent)}
ul.watch li::marker{color:var(--warn)}
.mus{font-size:14px}.mus b{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand">Training Log</span><span id="sync" data-s="busy">Loading</span></div>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"><div></div></nav>
<div id="sheet"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const monday=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const fmtD=(s,o)=>pd(s).toLocaleDateString('en-US',o||{month:'short',day:'numeric'});
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const f1=v=>v==null||v===''?'':String(+(+v).toFixed(1));
const clone=o=>JSON.parse(JSON.stringify(o));
const tryJ=(f,d)=>{try{return f()}catch(e){return d}};

/* ---------- exercise library ---------- */
const TL={wr:'Weight × reps',br:'Reps only',tm:'Hold / time',wt:'Weight × time',cd:'Cardio (min + miles)'};
const FIELDS={wr:[['w','lb'],['r','reps']],br:[['r','reps']],tm:[['s','sec']],wt:[['w','lb'],['s','sec']],cd:[['m','min'],['d','mi']]};
const GROUPS=['Legs','Hinge & glutes','Push','Pull','Core','Mobility','Cardio'];
const J={k:'knee',e:'elbow'};
// id, name, group, type, equipment, joints(k=knee,e=elbow), alternates
const LIB=[
['leg-press','Leg press','Legs','wr','Machine','k','hip-thrust,glute-bridge,leg-curl'],
['goblet-squat','Goblet squat','Legs','wr','Kettlebell','k','hip-thrust,glute-bridge,leg-curl'],
['leg-curl','Seated leg curl','Legs','wr','Machine','','glute-bridge,db-rdl'],
['leg-ext','Leg extension','Legs','wr','Machine','k','leg-curl,glute-bridge'],
['calf-raise','Calf raise','Legs','wr','Machine','','calf-stretch'],
['split-squat','Split squat','Legs','wr','Dumbbells','k','glute-bridge,hip-thrust'],

['db-rdl','Dumbbell Romanian deadlift','Hinge & glutes','wr','Dumbbells','','kb-deadlift,hip-thrust,leg-curl'],
['kb-deadlift','Kettlebell deadlift','Hinge & glutes','wr','Kettlebell','','db-rdl,hip-thrust'],
['kb-swing','Kettlebell swing','Hinge & glutes','wr','Kettlebell','','kb-deadlift,db-rdl'],
['hip-thrust','Hip thrust','Hinge & glutes','wr','Machine or bench','','glute-bridge,db-rdl'],
['glute-bridge','Glute bridge','Hinge & glutes','br','Bodyweight','','hip-thrust,db-rdl'],
['chest-press-machine','Chest press (machine)','Push','wr','Machine','e','pec-deck,lateral-raise'],
['db-bench','Dumbbell bench press','Push','wr','Dumbbells','e','pec-deck,chest-press-machine'],
['incline-pushup','Incline push-up','Push','br','Bodyweight','e','pec-deck,lateral-raise'],
['db-shoulder-press','Dumbbell shoulder press','Push','wr','Dumbbells','e','lateral-raise,shoulder-press-machine'],
['shoulder-press-machine','Shoulder press (machine)','Push','wr','Machine','e','lateral-raise'],
['lateral-raise','Lateral raise','Push','wr','Dumbbells','','face-pull'],
['pec-deck','Pec deck / cable fly','Push','wr','Machine','','lateral-raise'],
['triceps-pushdown','Triceps pushdown','Push','wr','Cable','e','lateral-raise'],
['lat-pulldown','Lat pulldown','Pull','wr','Machine','e','reverse-fly,face-pull'],
['seated-cable-row','Seated cable row','Pull','wr','Cable','e','reverse-fly,face-pull'],
['db-row','One-arm dumbbell row','Pull','wr','Dumbbells','e','seated-cable-row,reverse-fly'],
['assisted-pullup','Assisted pull-up','Pull','wr','Machine','e','lat-pulldown,reverse-fly'],
['face-pull','Face pull','Pull','wr','Cable','','reverse-fly'],
['reverse-fly','Reverse fly (machine)','Pull','wr','Machine','','face-pull'],
['biceps-curl','Biceps curl','Pull','wr','Dumbbells','e','face-pull'],
['plank','Plank','Core','tm','Bodyweight','','dead-bug,bird-dog'],
['dead-bug','Dead bug','Core','br','Bodyweight','','bird-dog,plank'],
['bird-dog','Bird dog','Core','br','Bodyweight','k','dead-bug,plank'],
['farmers-carry','Farmer’s carry','Core','wt','Dumbbells or kettlebells','','plank,dead-bug'],
['pallof-press','Pallof press','Core','wr','Cable','','dead-bug,plank'],
['hip-flexor-stretch','Hip flexor stretch','Mobility','tm','Mat','','ninety-ninety,hamstring-stretch'],
['thoracic-rotation','Thoracic rotation','Mobility','br','Mat','','cat-cow'],
['hamstring-stretch','Hamstring stretch','Mobility','tm','Mat','','calf-stretch'],
['calf-stretch','Calf stretch','Mobility','tm','Wall','','hamstring-stretch'],
['cat-cow','Cat-cow','Mobility','br','Mat','k','thoracic-rotation'],

const wArr=()=>Object.entries(S.weights).map(([d,v])=>({d,lb:v.lb})).sort((a,b)=>a.d<b.d?-1:1);
const topOf=e=>{const ss=okSets(e);if(!ss.length)return null;const m=k=>Math.max(...ss.map(s=>s[k]||0));
  return e.type==='cd'?ss.reduce((a,s)=>a+(s.m||0),0):e.type==='wr'||e.type==='wt'?m('w'):e.type==='br'?m('r'):m('s')};

const fmtSet=t=>s=>t==='wr'?`${f1(s.w||0)}×${s.r||0}`:t==='br'?`${s.r||0}`:t==='tm'?`${s.s||0}s`:t==='wt'?`${f1(s.w||0)} lb × ${s.s||0}s`:`${s.m||0} min${s.d?` · ${s.d} mi`:''}`;
const volume=ses=>(ses.entries||[]).reduce((a,e)=>a+(e.type==='wr'?okSets(e).reduce((b,s)=>b+(s.w||0)*(s.r||0),0):0),0);
function lastTime(id,before){const ds_=sessDates().filter(d=>d<before).reverse();
  for(const d of ds_){const e=(S.sessions[d].entries||[]).find(x=>x.ex===id&&okSets(x).length);if(e)return{date:d,entry:e}}return null}
function bestBefore(id,before,type){let b=null;for(const d of sessDates()){if(d>=before)break;for(const e of S.sessions[d].entries||[])if(e.ex===id){const t=topOf(e);if(t!=null&&(b==null||t>b))b=t}}return b}
function histFor(id){const out=[];for(const d of sessDates())for(const e of S.sessions[d].entries||[])if(e.ex===id&&okSets(e).length){
  const ss=okSets(e);out.push({d,y:topOf(e),tip:ss.map(fmtSet(e.type)).join(', '),type:e.type})}return out}

/* ---------- session logic ---------- */
function pickAlt(ex){for(const id of ex.alts||[]){const a=exById(id);if(a&&!conflict(a))return a}return null}
function mkEntry(id,n,tgt){let ex=exById(id),from=null;
  if(ex&&conflict(ex)){const a=pickAlt(ex);if(a){from=ex.name;ex=a}}
  const last=lastTime(ex.id,S.date),ls=last?okSets(last.entry):[];
  const sets=Array.from({length:n||1},(_,i)=>{const src=ls[i]||ls[ls.length-1];const o={ok:false};
    if(src)for(const [k] of FIELDS[ex.type])if(src[k]!=null)o[k]=src[k];return o});
  return{ex:ex.id,name:ex.name,type:ex.type,target:tgt||'',sets,from}}
function nextPlan(){const d=sessDates().filter(x=>x<=S.date&&S.sessions[x].plan).pop();if(!d)return'A';return{A:'B',B:'C',C:'A'}[S.sessions[d].plan]||'A'}
function startSession(kind){const d=S.date;let s;
  if(PLAN[kind])s={date:d,plan:kind,title:`Day ${kind} · ${PLAN[kind].name}`,entries:PLAN[kind].items.map(([id,n,t])=>mkEntry(id,n,t))};
  else if(kind==='walk')s={date:d,plan:null,title:'Walk / cardio',entries:[mkEntry('walk',1,'')]};
  else s={date:d,plan:null,title:'Workout',entries:[]};
  Object.assign(s,{note:'',feel:null,done:false,created:Date.now()});S.sessions[d]=s;saveSession(d);render(true)}
const cur=()=>S.sessions[S.date];

/* ---------- charts ---------- */
function niceTicks(lo,hi,n){if(lo===hi){lo-=1;hi+=1}const raw=(hi-lo)/n,mag=10**Math.floor(Math.log10(raw)),f=raw/mag;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag,a=Math.floor(lo/step+1e-9)*step,b=Math.ceil(hi/step-1e-9)*step,t=[];
  for(let v=a;v<=b+step/2;v+=step)t.push(+v.toFixed(6));return t}
function lineChart(host,pts,o={}){
  if(!pts.length){host.innerHTML='<p class="empty">Nothing logged here yet. This fills in as you add entries.</p>';return}
  const W=360,H=210,m={l:40,r:14,t:16,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b,unit=o.unit||'';
  const ys=pts.map(p=>p.y);if(o.goal!=null)ys.push(o.goal);
  const lo=Math.min(...ys),hi=Math.max(...ys),pad=(hi-lo)*.15||Math.max(1,hi*.05);
  const ticks=niceTicks(lo-pad,hi+pad,4),y0=ticks[0],y1=ticks[ticks.length-1];
  const t0=pts[0].t,t1=pts[pts.length-1].t,X=t=>t1===t0?m.l+iw/2:m.l+(t-t0)/(t1-t0)*iw,Y=v=>m.t+ih-(v-y0)/(y1-y0)*ih;
  const xl=t1===t0?[[t0,'middle']]:[[t0,'start'],[(t0+t1)/2,'middle'],[t1,'end']];
  const lab=t=>new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  let g=ticks.map(v=>`<line class="c-grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="c-tick" x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${f1(v)}</text>`).join('');
  g+=xl.map(([t,a])=>`<text class="c-tick" x="${a==='start'?m.l:a==='end'?W-m.r:X(t)}" y="${H-8}" text-anchor="${a}">${lab(t)}</text>`).join('');
  if(o.goal!=null)g+=`<line class="c-goal" x1="${m.l}" x2="${W-m.r}" y1="${Y(o.goal)}" y2="${Y(o.goal)}"/><text class="c-goaltxt" x="${W-m.r}" y="${Y(o.goal)-5}" text-anchor="end">Goal ${f1(o.goal)}</text>`;
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(p.t).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  g+=pts.length>1?`<path class="c-line" d="${d}"/>`:'';
  if(pts.length<=80)g+=pts.map(p=>`<circle class="c-dot" cx="${X(p.t)}" cy="${Y(p.y)}" r="${p===pts[pts.length-1]?5:3.5}"/>`).join('');
  g+=`<line class="c-cross" id="cx" y1="${m.t}" y2="${m.t+ih}" visibility="hidden"/><circle class="c-dot" id="hl" r="6" visibility="hidden"/>`;
  host.innerHTML=`<div class="readout"><b></b><span></span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Line chart')}">${g}</svg>`;
  const svg=host.querySelector('svg'),rb=host.querySelector('.readout b'),rs=host.querySelector('.readout span'),cx=svg.querySelector('#cx'),hl=svg.querySelector('#hl');
  const show=(p,hover)=>{rb.textContent=`${f1(p.y)} ${unit}`;rs.textContent=`${lab(p.t)}${p.tip?' · '+p.tip:''}`;
    if(hover){cx.setAttribute('x1',X(p.t));cx.setAttribute('x2',X(p.t));cx.setAttribute('visibility','visible');hl.setAttribute('cx',X(p.t));hl.setAttribute('cy',Y(p.y));hl.setAttribute('visibility','visible')}};
  show(pts[pts.length-1],false);
  const mv=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;let b=pts[0];for(const p of pts)if(Math.abs(X(p.t)-x)<Math.abs(X(b.t)-x))b=p;show(b,true)};
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);
}
function barChart(host,bars,o={}){
  const W=360,H=190,m={l:30,r:10,t:14,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const max=Math.max(o.target||0,...bars.map(b=>b.v),1),ticks=niceTicks(0,max,3),top=ticks[ticks.length-1];
  const Y=v=>m.t+ih-v/top*ih,bw=iw/bars.length,w=bw*.62;
  let g=ticks.map(v=>`<line class="c-grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="c-tick" x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('');
  g+=bars.map((b,i)=>{const x=m.l+i*bw+(bw-w)/2,y=Y(b.v),h=m.t+ih-y,r=Math.min(4,h);
    const bar=b.v>0?`<path class="c-bar ${i===bars.length-1?'cur':''}" data-i="${i}" d="M${x},${m.t+ih}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${m.t+ih}Z"/>`:'';
    const lbl=(i%3===0||i===bars.length-1)?`<text class="c-tick" x="${x+w/2}" y="${H-8}" text-anchor="middle">${b.short}</text>`:'';return bar+lbl}).join('');
  if(o.target)g+=`<line class="c-goal" x1="${m.l}" x2="${W-m.r}" y1="${Y(o.target)}" y2="${Y(o.target)}"/><text class="c-goaltxt" x="${W-m.r}" y="${Y(o.target)-5}" text-anchor="end">Target ${o.target}</text>`;
  host.innerHTML=`<div class="readout"><b></b><span></span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Bar chart')}">${g}</svg>`;
  const svg=host.querySelector('svg'),rb=host.querySelector('.readout b'),rs=host.querySelector('.readout span');
  const show=i=>{const b=bars[i];rb.textContent=`${b.v} active day${b.v===1?'':'s'}`;rs.textContent=b.tip;svg.querySelectorAll('.c-bar').forEach(p=>p.classList.toggle('hl',+p.dataset.i===i))};
  show(bars.length-1);
  const mv=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;show(Math.max(0,Math.min(bars.length-1,Math.floor((x-m.l)/bw))))};
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);
}

const FAQ=[
['My knee is sore. What should I do?','knee sore hurts hurt pain leg press squat lunge step',`- Turn on the Knee marker in the Log tab. New workouts then swap leg press, squats and lunges for hip thrusts, glute bridges and leg curls.
- Keep walking if it doesn't hurt while you do it.
- When you return, go lighter than before, slow the lowering, and shorten the range if the bottom position bothers you.
- Stop and get it checked if pain is sharp, keeps getting worse, or comes with swelling, locking or the knee giving way.`],
['My elbow is sore. What can I still do?','elbow tendon forearm pain sore press pull curl triceps grip',`- Turn on the Elbow marker. Pressing and pulling moves get flagged and swapped for lateral raises, pec deck, reverse fly and face pulls.
- Keep training legs, glutes, core and mobility as usual.
- When you return to pressing or pulling, use machines with a comfortable grip, lighter loads and 12 to 15 reps, and don't lock out hard.
- Stop and get it checked for sharp pain, numbness or tingling, or pain that wakes you up.`],
['How do I move from the leg press to squats?','leg press squat goblet kettlebell rack barbell progress move',`- Keep the leg press as your base. Add the goblet squat as a skill session, not a replacement.
- Hold one kettlebell at your chest, feet shoulder width, sit down between your knees, chest tall, heels flat.
- Start by sitting back to a bench or box so the depth is the same every rep. Use a weight you can do 10 clean reps with.
- When 3 sets of 10 feel easy, add a second weekly set of goblet squats, then move up in weight.`],
['When should I add weight?','add weight progress progressive overload heavier increase when more',`- Use double progression: pick a rep range like 8 to 12 and stay at one weight until every set reaches the top of the range.
- Then add a small jump: 2.5 to 5 lb for most lifts, smaller for shoulders and arms.
- The first sets at the new weight will drop back toward the bottom of the range. That's normal.
- The Log tab shows last time's numbers and nudges you when it's time to go up.`],
['How many sets and reps should I do?','sets reps how many volume much',`- Most lifts: 2 to 3 sets of 8 to 12 reps.
- Stop each set with 1 to 3 reps still in the tank. Hard, not grinding.
- 5 to 6 exercises covers a full-body session in 30 to 60 minutes.
- Core and mobility work can be shorter: 2 sets of holds or slow reps.`],
['How do I lose the last 10 lb and keep my muscle?','lose weight fat muscle deficit protein calories last pounds diet',`- Aim for 0.5 to 1 lb per week. Faster loss costs muscle.
- Keep lifting and keep trying to add reps or weight. That signals your body to keep the muscle.
- Protein of roughly 0.7 to 1 g per lb of your goal weight, spread over your meals, is a common target.
- Sleep 7 to 9 hours and add easy walks. They burn calories without hurting recovery.`],
['The scale is not moving.','scale stuck plateau stall weight not moving same flat',`- Weigh at the same time of day, and judge the trend over 2 to 3 weeks, not single days.
- Track your waist or how clothes fit. You can lose fat and gain muscle at the same weight.
- Salt, hard workouts and hormones swing water weight by a few pounds.
- If it's truly flat for 3 to 4 weeks with consistent habits, add two 20 minute walks or trim a small amount of daily food. Change one thing at a time.`],
['How do I do a dumbbell Romanian deadlift?','romanian rdl deadlift hinge dumbbell hamstring back',`- Stand tall with dumbbells at your thighs, soft knees, shoulders back.
- Push your hips back like closing a car door, keeping the weights close to your legs.
- Lower until you feel a stretch in the back of your thighs, with a flat back. That's usually mid-shin.
- Squeeze your glutes to stand. Start light. The weight you can control matters more than the weight you can lift.`],
['How do I do a kettlebell goblet squat or deadlift?','kettlebell goblet deadlift swing kb bell',`- Goblet squat: hold the bell at your chest, elbows inside your knees at the bottom, heels down.
- Kettlebell deadlift: bell between your feet, hips back, flat back, push the floor away.
- Brace your core before each rep and breathe out as you stand.
- Skip swings until the deadlift feels automatic. The swing is the same hinge, done fast.`],
['What should my warm-up be?','warm warmup warm-up stretch before start',`- 3 to 5 minutes of easy walking or the bike.
- 1 to 2 light sets of your first exercise.
- Hip flexor stretch and thoracic rotations if you sit a lot.
- Save long static stretches for after the workout.`],
['Give me a 10 minute mobility routine','mobility stretch stiff flexibility routine yoga mat flow',`- Cat-cow, 8 slow reps.
- Thoracic rotation, 8 each side.
- Hip flexor stretch, 30 seconds each side.
- 90/90 hip switches, 8 reps.
- Hamstring stretch, 30 seconds each side.
- Calf stretch, 30 seconds each side. Breathe slowly and never stretch into sharp pain.`],
['I only have 20 minutes today.','short time busy quick minutes walk skip missed lazy tired',`- A 20 minute walk counts. Log it with Walk or cardio in the Log tab.
- Or do a 20 minute lift: leg press, a push, a pull. 2 sets each.
- Don't double up the next day to make up for it. Just carry on with the next workout in the plan.
- Consistency over weeks matters more than any single session.`],
['Is soreness normal? How do I tell it from pain?','sore soreness doms pain normal ache injury',`- Dull, even soreness in the muscle that peaks a day or two after training is normal.
- Sharp, pinching or joint-line pain, pain that gets worse as you train, or numbness is not. Stop that exercise.
- Light movement and walking usually ease soreness faster than complete rest.
- Pain that lasts more than a week or two is worth showing a clinician.`],
['How many days a week, and what about rest?','days week rest recovery schedule split frequency',`- Three full-body days with a rest day between each (for example Mon, Wed, Fri) is plenty to build muscle.
- Days 4 and 5 can be walks, mobility or easy cardio.
- If you feel run down for several days in a row, take an extra rest day.
- The Log tab suggests the next day in the A, B, C rotation.`],
['What can I do at home with a mat, 5 lb dumbbells and a rope?','home dumbbells mat jump rope equipment travel hotel',`- Mat: glute bridges, dead bugs, bird dogs, planks and the mobility routine.
- 5 lb dumbbells: lateral raises, rows, curls and slow tempo Romanian deadlifts.
- Rope: 30 seconds on, 30 seconds off for 5 to 10 rounds.
- Add an incline push-up using a sturdy counter or couch.`],
['How do I use the jump rope safely?','jump rope jumping cardio rope weighted',`- Start with 20 to 30 seconds on and 30 to 60 seconds off.
- Small, low jumps, soft landings on the balls of your feet, wrists doing the turning.
- Skip it while the knee is resting. Walking or the bike are better swaps.`],
['I\u2019m new to free weights. How do I start safely?','free weights beginner learn form safe start light dumbbell spotter new',`- Learn each move with a very light weight, then add weight slowly.
- Mirror, or a short phone video from the side, shows more than you can feel.
- Use dumbbells and kettlebells before barbells. They're easier to bail out of.
- Pair each new free-weight move with the machine version you already know, then shift over week by week.`]
];
function faqMatch(q){const words=q.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2);if(!words.length)return[];

function insights(){const out=[],p=S.profile,W=wArr(),t=today(),target=p.target||3,ws=monday(t);
  const act=[...Array(7)].filter((_,i)=>isActive(S.sessions[addDays(ws,i)])).length;
  out.push(['This week',`${act} of ${target} active days so far.${act>=target?' Target hit. Anything more is a bonus.':act===0?' A 20 minute walk is enough to get the week moving.':''}`]);
  if(W.length>=2){const last=W[W.length-1],from=W.filter(x=>x.d>=addDays(last.d,-28))[0],days=(pd(last.d)-pd(from.d))/864e5;
    if(days>=10){const r=(last.lb-from.lb)/days*7,wk=Math.round(days/7),a=Math.abs(r).toFixed(1);let m;
      if(r<-1.2)m=`Down about ${a} lb a week over the last ${wk} weeks. That's faster than slow and steady, and fast loss can cost muscle. Keep protein up and keep lifting.`;
      else if(r<=-0.4){m=`Down about ${a} lb a week over the last ${wk} weeks. That's right in the slow, steady range.`;
        if(p.goalLb!=null&&last.lb>p.goalLb){const w=(last.lb-p.goalLb)/(-r);m+=` At this pace you'd reach ${f1(p.goalLb)} lb around ${fmtD(addDays(t,Math.round(w*7)),{month:'short',day:'numeric',year:'numeric'})}.`}}
      else if(r<0.3)m=`Weight is about flat over ${wk} weeks. That's common while building muscle. Check your waist or how clothes fit, and give it two more weeks before changing anything.`;
      else m=`Up about ${a} lb a week over ${wk} weeks. Water and muscle can do that. Watch the trend for a couple more weeks.`;
      out.push(['Weight trend',m])}
    else out.push(['Weight trend','Weigh in about once a week, same time of day. A real trend needs a couple of weeks of data.'])}
  else out.push(['Weight trend','Log your weight once a week, same time of day, to see a real trend here.']);
  const by={};for(const d of sessDates())for(const e of S.sessions[d].entries||[])if(okSets(e).length)(by[e.ex]=by[e.ex]||[]).push({d,e});
  const ready=[],stuck=[];
  for(const L of Object.values(by)){const {d,e}=L[L.length-1],up=(e.target||'').match(/(\d+)\D+(\d+)/),ss=okSets(e);
    if(e.type==='wr'&&up&&ss.length>=2&&d>=addDays(t,-21)&&ss.every(s=>(s.r||0)>=+up[2]&&s.w))ready.push(`${e.name}: ${f1(Math.max(...ss.map(s=>s.w)))} lb for ${up[2]} reps on every set. Try +2.5 to 5 lb next time.`);
    if(e.type==='wr'&&L.length>=3&&d>=addDays(t,-21)){const tops=L.slice(-3).map(x=>topOf(x.e));if(tops[0]>0&&tops.every(v=>v===tops[0]))stuck.push(e.name)}}
  if(ready.length)out.push(['Ready for more weight',ready.slice(0,4).join('\n')]);
  if(stuck.length)out.push(['Stuck lifts',`${stuck.slice(0,4).join(', ')}: same top weight for 3 sessions. Add a rep per set or try the next small jump. If it still stalls, drop about 10% for a week.`]);
  const rj=['knee','elbow'].filter(j=>S.rest[j]);
  if(rj.length)out.push(['Easing back in',`${rj.join(' and ')} marked as resting. Flagged exercises swap automatically in new workouts. When you return, go lighter, use more reps, and stop at sharp pain.`]);
  if(out.length<=2&&!sessDates().length)out.push(['Getting started','Log a few workouts and tick off your sets. Tips about adding weight and stuck lifts show up here.']);
  return out}

function pickList(){const sh=S.sheet,q=(sh.q||'').toLowerCase();let L=exAll();
  if(sh.g&&sh.g!=='All')L=L.filter(e=>e.group===sh.g);if(q)L=L.filter(e=>e.name.toLowerCase().includes(q));
  if(sh.k==='swap'){const cu=cur().entries[sh.ei],base=exById(cu.ex),al=base?base.alts:[];L=L.filter(e=>e.id!==cu.ex).sort((a,b)=>(al.includes(b.id)?1:0)-(al.includes(a.id)?1:0)||(conflict(a)?1:0)-(conflict(b)?1:0))}
  return L.slice(0,80).map(e=>{const bad=(e.joints||[]).filter(j=>S.rest[j]);const main=`<button class="pick" data-act="${sh.k==='guide'?'info':'pick'}:${esc(e.id)}"><strong>${esc(e.name)}</strong><small>${esc(e.group)} · ${esc(e.equip||'')} ${bad.length?`<em> · ${bad.join(' + ')} resting</em>`:''}</small></button>`;
    return sh.k==='guide'?main:`<div class="prow">${main}<button class="info" data-act="info:${esc(e.id)}" aria-label="How to do ${esc(e.name)}">How to</button></div>`}).join('')||'<p class="empty">No match. Create it below.</p>'}

/* ---------- render ---------- */
function typing(){const a=document.activeElement;return!!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#view').contains(a)}
function render(force){
  if(!force&&typing()){S.dirty=true;return}S.dirty=false;
  const v=$('#view'),tabs=$('#tabs');
  if(!S.loaded){v.innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';tabs.hidden=true;return}
  $('.top').hidden=!S.entered;
  if(!S.entered){tabs.hidden=true;v.innerHTML=viewLanding();return}
  if(!S.profile){tabs.hidden=true;v.innerHTML=viewSetup();return}
  tabs.hidden=false;
  tabs.firstElementChild.innerHTML=TABS.map(([k,l])=>`<button data-act="tab:${k}" ${S.tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${l}</button>`).join('');
  v.innerHTML=({today:viewToday,progress:viewProgress,diary:viewDiary,coach:viewCoach,me:viewMe})[S.tab]();
  if(S.tab==='progress')drawCharts();
  if(S.sheet&&!$('#sheet').firstChild)renderSheet();
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.dirty&&!typing())render()},50));

/* ---------- events ---------- */
document.addEventListener('input',e=>{const t=e.target,b=t.dataset?.b;
  if(b==='set'){const s=cur()?.entries[+t.dataset.ei]?.sets[+t.dataset.si];if(s){const v=num(t.value);if(t.value.trim()==='')delete s[t.dataset.k];else if(v!=null)s[t.dataset.k]=v;saveSession(S.date)}}
  else if(b==='snote'){cur().note=t.value;saveSession(S.date)}
  else if(b==='dt'){S.draft.text=t.value}
  else if(t.id==='sq'&&S.sheet){S.sheet.q=t.value;$('#pl').innerHTML=pickList()}
  });
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='dd'){S.diaryDate=t.value||today();S.draft=null;render(true)}
  else if(t.id==='sx'){S.strengthEx=t.value;render(true)}
  else if(t.id==='imp'){importBackup(t.files&&t.files[0]);t.value=''}});
document.addEventListener('keydown',e=>{if(e.target.id==='cq'&&e.key==='Enter'){e.preventDefault();S.cq=e.target.value.trim();S.cres=faqMatch(S.cq);render(true)}});

document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const [a,...r]=el.dataset.act.split(':'),arg=r.join(':');
  if(el.classList.contains('scrim')&&ev.target!==el)return;
  const A=ev=>S.sessions[S.date];
  switch(a){
  case'tab':S.tab=arg;S.confirmDel=false;render(true);window.scrollTo(0,0);break;
  case'day':S.date=arg;S.confirmDel=false;render(true);break;
  case'wk':S.date=addDays(S.date,7*+arg);render(true);break;
  case'rest':S.rest[arg]=!S.rest[arg];saveApp();render(true);break;
  case'start':startSession(arg);break;
  case'tick':{const[ei,si]=arg.split(':').map(Number),s=cur().entries[ei].sets[si];s.ok=!s.ok;saveSession(S.date);render(true);break}
  case'addset':{const e=cur().entries[+arg],l=e.sets[e.sets.length-1]||{};const n={ok:false};for(const[k]of FIELDS[e.type])if(l[k]!=null)n[k]=l[k];e.sets.push(n);saveSession(S.date);render(true);break}
  case'delset':{const[ei,si]=arg.split(':').map(Number);cur().entries[ei].sets.splice(si,1);saveSession(S.date);render(true);break}
  case'rm':cur().entries.splice(+arg,1);saveSession(S.date);render(true);break;
  case'finish':cur().done=!cur().done;saveSession(S.date);render(true);break;
  case'sfeel':cur().feel=cur().feel===+arg?null:+arg;saveSession(S.date);render(true);break;
  case'delsession':if(!S.confirmDel){S.confirmDel=true;render(true)}else{delete S.sessions[S.date];S.confirmDel=false;clearTimeout(timers[S.date]);pendingDates.delete(S.date);persist('sessions',S.date,null);render(true)}break;
  case'openadd':S.sheet={k:'add',q:'',g:'All'};renderSheet();break;
  case'swap':S.sheet={k:'swap',ei:+arg,q:'',g:'All'};renderSheet();break;
  case'closesheet':S.sheet=null;renderSheet();break;
  case'enter':S.entered=true;window.scrollTo(0,0);render(true);break;
  case'info':{const f=S.sheet&&(S.sheet.k==='add'||S.sheet.k==='swap'||S.sheet.k==='guide')?S.sheet:null;S.sheet={k:'info',id:arg,from:f};renderSheet();break}
  case'infoback':S.sheet=S.sheet.from;renderSheet();break;
  case'guide':S.sheet={k:'guide',q:'',g:'All'};renderSheet();break;
  case'addto':{const ex=exById(arg);if(ex&&cur()){cur().entries.push(mkEntry(ex.id,3,''));saveSession(S.date);S.sheet=null;renderSheet();S.tab='today';render(true);window.scrollTo(0,document.body.scrollHeight)}break}
  case'grp':S.sheet.g=arg;renderSheet();break;
  case'pick':{const ex=exById(arg);if(!ex)break;const sh=S.sheet;
    if(sh.k==='swap'){const old=cur().entries[sh.ei],n=mkEntry(ex.id,old.sets.length,old.target);n.from=old.from||old.name;
      n.sets=n.sets.map(s=>({...s,ok:false}));cur().entries[sh.ei]=n}
    else cur().entries.push(mkEntry(ex.id,3,''));
    S.sheet=null;renderSheet();saveSession(S.date);render(true);break}
  case'newcustom':S.sheet={k:'custom',from:S.sheet};renderSheet();break;
  case'savecustom':{const name=$('#cn').value.trim();if(!name){$('#cn').focus();break}
    const c={id:'c-'+Date.now().toString(36),name,group:$('#cg').value,type:$('#ct').value};S.custom.push(c);saveApp();
    const prev=S.sheet.from;S.sheet=null;renderSheet();
    if(prev&&cur()&&prev.k==='add'){cur().entries.push(mkEntry(c.id,3,''));saveSession(S.date)}render(true);break}
  case'delcustom':S.custom=S.custom.filter(c=>c.id!==arg);saveApp();render(true);break;
  case'range':S.range=arg;render(true);break;
  case'savew':{const v=num($('#wv').value),d=$('#wd').value||today();if(v==null||v<50||v>700){$('#wv').focus();break}
    S.weights[d]={lb:v,ts:Date.now()};persist('weights',d,S.weights[d]);render(true);break}
  case'delw':delete S.weights[arg];persist('weights',arg,null);render(true);break;
  case'dfeel':S.draft.feel=S.draft.feel===+arg?null:+arg;render(true);break;
  case'savediary':{const d=S.draft.date;if(!S.draft.text.trim()&&!S.draft.feel)break;S.days[d]={note:S.draft.text.trim(),feel:S.draft.feel,ts:Date.now()};persist('days',d,S.days[d]);render(true);break}
  case'deldiary':{const d=S.draft.date;delete S.days[d];persist('days',d,null);S.draft=null;render(true);break}
  case'editday':S.diaryDate=arg;S.draft=null;render(true);window.scrollTo(0,0);break;
  case'cask':{S.cq=$('#cq').value.trim();S.cres=faqMatch(S.cq);render(true);break}
  case'topic':S.cq=FAQ[+arg][0];S.cres=[+arg];render(true);window.scrollTo(0,0);break;
  case'savesetup':{const p=readProfile();S.profile=p;saveApp();const d=today();
    if(p.startLb&&!S.weights[d]){S.weights[d]={lb:p.startLb,ts:Date.now()};persist('weights',d,S.weights[d])}render(true);break}
  case'saveprofile':{S.profile=readProfile();saveApp();el.textContent='Saved';setTimeout(()=>{if(el.isConnected)el.textContent='Save profile'},1400);break}
  case'exp':exportCSV(arg);break}
});
function downloadFile(name,text,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function exportCSV(kind){const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  if(kind==='j'){S.lastBackup=Date.now();saveLocal();downloadFile(`training-log-backup-${today()}.json`,JSON.stringify({...snapshot(),exportedAt:new Date().toISOString()}),'application/json');render(true);return}
  let rows;
  if(kind==='w')rows=[['date','workout','exercise','set','weight_lb','reps','seconds','minutes','miles']].concat(sessDates().flatMap(d=>(S.sessions[d].entries||[]).flatMap(e=>okSets(e).map((s,i)=>[d,S.sessions[d].title,e.name,i+1,s.w??'',s.r??'',s.s??'',s.m??'',s.d??'']))));
  else rows=[['date','weight_lb']].concat(wArr().map(x=>[x.d,x.lb]));
  downloadFile(kind==='w'?'training-log-workouts.csv':'training-log-weights.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')}
function importBackup(file){if(!file)return;const msg=$('#impmsg');
  file.text().then(txt=>{const d=JSON.parse(txt);if(!d||typeof d!=='object'||(!d.sessions&&!d.weights&&!d.days))throw new Error('bad');
    const ns=Object.keys(d.sessions||{}).length,nw=Object.keys(d.weights||{}).length;
    S.sessions={...S.sessions,...(d.sessions||{})};S.weights={...S.weights,...(d.weights||{})};S.days={...S.days,...(d.days||{})};
    const have=new Set(S.custom.map(c=>c.id));S.custom=[...S.custom,...(d.custom||[]).filter(c=>!have.has(c.id))];
    if(!S.profile&&d.profile)S.profile=d.profile;saveLocal();render(true);const m=$('#impmsg');if(m)m.textContent=`Restored ${ns} workouts and ${nw} weigh-ins.`})
  .catch(()=>{if(msg)msg.textContent='That file does not look like a Training Log backup.'})}

/* ---------- boot ---------- */
setSync('load');render(true);loadLocal();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
