<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f1f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training Log">
<meta name="description" content="A private workout log: flexible exercise logging, journal notes, progress charts and a built-in coach. Data stays in your browser.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Training Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column, five bottom tabs. Look: gym-floor signage (condensed numerals, chalk-gray ground, one blue). */
:root{
  --bg:#f1f2ee; --surface:#ffffff; --surface-2:#e8eae4; --ink:#14181b; --ink-2:#4b545b; --ink-3:#6f7980;
  --line:#d8dbd3; --grid:#e4e7e0; --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e3eefb;
  --good:#0f7a3a; --good-soft:#e1f3e8; --warn:#9a5200; --warn-soft:#fff0d8; --bad:#b3261e;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --text:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1214; --surface:#171b1e; --surface-2:#22282c; --ink:#eef1ee; --ink-2:#b7c0c5; --ink-3:#8c979e;
  --line:#2b3237; --grid:#242b30; --accent:#3987e5; --accent-ink:#04101e; --accent-soft:#16283d;
  --good:#52c882; --good-soft:#142a1d; --warn:#f0a443; --warn-soft:#2d2312; --bad:#ff8a80; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f1214; --surface:#171b1e; --surface-2:#22282c; --ink:#eef1ee; --ink-2:#b7c0c5; --ink-3:#8c979e;
  --line:#2b3237; --grid:#242b30; --accent:#3987e5; --accent-ink:#04101e; --accent-soft:#16283d;
  --good:#52c882; --good-soft:#142a1d; --warn:#f0a443; --warn-soft:#2d2312; --bad:#ff8a80; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
html{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--text);padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font:700 30px/1.05 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font:600 20px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0 0 10px;color:var(--ink-2)}
p{margin:0}
.sub{color:var(--ink-2);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;min-height:44px}
.brand{font:700 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
#sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
#sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
#sync[data-s="busy"]::before{background:var(--accent)} #sync[data-s="local"]::before{background:var(--warn)} #sync[data-s="err"]::before{background:var(--bad)}
main{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}

/* controls */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;min-height:46px;padding:0 18px;font-weight:600}
.btn.wide{width:100%}
.btn.out{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.irid{border:0;border-radius:10px;min-height:40px;padding:0 16px;font-weight:800;color:#111;background:linear-gradient(110deg,#ff7ad9,#ffd36e,#7dffb2,#6ee7ff,#a78bfa,#ff7ad9);background-size:300% 100%;box-shadow:0 0 0 1.5px rgba(255,255,255,.55) inset,0 2px 10px rgba(120,90,255,.35);text-shadow:0 1px 0 rgba(255,255,255,.4)}
@media (prefers-reduced-motion:no-preference){.irid{animation:irid 4s linear infinite}}
@keyframes irid{to{background-position:300% 0}}
.irid:active{transform:scale(.97)}
.link{background:none;border:0;color:var(--accent);padding:8px 2px;font-weight:600;min-height:40px}
.link.bad{color:var(--bad)}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-height:38px;padding:0 14px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.warn[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
input[type=text],input[type=date],textarea,select{width:100%;background:var(--surface-2);color:var(--ink);border:1.5px solid transparent;border-radius:10px;min-height:44px;padding:10px 12px;font:inherit}
textarea{min-height:96px;resize:vertical}
label.lbl{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;color:var(--ink-3);font-size:12px;font-weight:600;border-radius:10px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* week strip */
.strip{display:flex;align-items:center;gap:4px}
.strip .arrow{background:none;border:0;width:34px;min-height:56px;font-size:22px;color:var(--ink-2)}
.strip .d{flex:1;min-width:0;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink-2);font-weight:600}
.strip .d b{font:600 18px/1 var(--display);color:var(--ink)}
.strip .d[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.strip .d i{width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--line)}
.strip .d.on i{background:var(--good);border-color:var(--good)}
.strip .d.now b{color:var(--accent)}
.weekline{font-size:14px;color:var(--ink-2)} .weekline b{font:700 20px var(--display);color:var(--ink)}

/* plan cards */
.plan{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.plan .ltr{font:700 34px/1 var(--display);color:var(--accent);width:28px}
.plan strong{display:block;font-weight:600}
.plan small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}

/* exercise entries */
.ex h3{font:600 21px/1.1 var(--display);margin:0}
.ex .meta{font-size:13px;color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:7px 10px}
.hint b{color:var(--ink)}
.flag{font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:7px 10px;font-weight:500}
.pr{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--good);background:var(--good-soft);border-radius:6px;padding:2px 7px;text-transform:uppercase}
.set{display:flex;align-items:center;gap:8px}
.set .n{width:22px;text-align:center;font:600 18px var(--display);color:var(--ink-3)}
.set .fld{flex:1;min-width:0;position:relative;display:block}
.set .fld input{padding-right:34px;text-align:right;font:600 18px var(--display);min-height:46px}
.set .fld i{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;color:var(--ink-3);pointer-events:none}
.tick{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-3);flex:none}
.play{color:var(--accent)}.play svg{fill:currentColor!important;stroke:none!important}
.tick svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.set.ok .tick{background:var(--good);border-color:var(--good);color:#fff}
.set.ok .fld input{background:var(--good-soft)}
.x{width:30px;height:46px;background:none;border:0;color:var(--ink-3);font-size:20px;flex:none}
.exfoot{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}

/* stats / charts */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .k{font-size:12px;color:var(--ink-2);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tile .v{font:700 34px/1.05 var(--display);margin-top:2px}
.tile .s{font-size:12px;color:var(--ink-2)}
.readout{display:flex;align-items:baseline;gap:8px;min-height:30px}
.readout b{font:700 26px/1 var(--display)} .readout span{font-size:13px;color:var(--ink-2)}
svg.chart{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.c-grid{stroke:var(--grid);stroke-width:1}
.c-tick{fill:var(--ink-2);font:500 11px var(--text)}
.c-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.c-goal{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:5 4}
.c-goaltxt{fill:var(--ink-2);font:600 11px var(--text)}
.c-cross{stroke:var(--ink-3);stroke-width:1}
.c-bar{fill:var(--accent);opacity:.55} .c-bar.cur{opacity:1} .c-bar.hl{opacity:1}
.seg{display:flex;gap:6px}
.seg .chip{min-height:34px;padding:0 12px;font-size:13px}
details.tbl{margin-top:8px;font-size:13px} details.tbl summary{color:var(--accent);font-weight:600;cursor:pointer;min-height:32px;display:flex;align-items:center}
details.tbl table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
details.tbl td,details.tbl th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:500}
details.tbl th{color:var(--ink-2);font-size:12px}
.empty{color:var(--ink-2);font-size:14px;padding:18px 4px;text-align:center}

/* journal + chat */
.entry .date{font:600 19px var(--display);letter-spacing:.02em}
.entry .body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.badge{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2)}
.feel .chip{flex:1;padding:0 4px;min-width:0}
.bubble{border-radius:14px;padding:10px 13px;max-width:92%;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.bubble p+p,.bubble ul+p,.bubble p+ul{margin-top:8px} .bubble ul{margin:0;padding-left:20px}
.chat{display:flex;flex-direction:column;gap:10px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;height:46px;resize:none}

/* sheet */
#sheet:empty{display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.pick{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:52px;display:block}
.pick strong{font-weight:600} .pick small{display:block;color:var(--ink-2);font-size:12px} .pick em{font-style:normal;color:var(--warn);font-size:12px;font-weight:600}
.skel{height:84px;border-radius:14px;background:var(--surface-2);opacity:.7}
.note{font-size:13px;color:var(--ink-2)}
.vd{border-radius:12px;padding:10px 12px;background:var(--surface-2);color:var(--ink)}
.vd b{display:block;font-size:15px}.vd p{margin:5px 0 0;font-size:14px;line-height:1.4;color:inherit}
.vd.good{background:var(--good-soft);color:var(--good)}.vd.warn{background:var(--warn-soft);color:var(--warn)}
svg.gauge{width:100%;height:auto;display:block}.gauge text{fill:var(--ink-2);font:600 10.5px var(--text)}.gauge .gv{fill:var(--ink);font-size:11.5px}
.tbar{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto}
.tbar .tn{font-size:13px;color:var(--ink-2);font-weight:600}.tbar .tt{font:700 44px/1 var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--ink)}
.tbar .pb{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}.tbar .pb i{display:block;height:100%;width:0;background:var(--accent)}
.tbar .tg{font-size:13px;color:var(--ink-2)}body.timing main{padding-bottom:230px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:14px}
.done{background:var(--good-soft);color:var(--good);border-radius:12px;padding:12px 14px;font-weight:600}
@media (prefers-reduced-motion:no-preference){ .btn,.chip,.tick{transition:background .12s,border-color .12s} }
[hidden]{display:none!important}
.landing{min-height:calc(100dvh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:28px 0 8px}
.landing .logo svg{width:96px;height:96px;display:block}
.eyebrow{font:600 13px var(--text);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.hero{font:700 clamp(40px,12.5vw,58px)/.98 var(--display);text-transform:uppercase;max-width:11em;text-wrap:balance}
.landstats{display:flex;gap:10px;width:100%}
.landstats div{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.landstats b{display:block;font:700 30px/1 var(--display)} .landstats span{font-size:12px;color:var(--ink-2)}
.upnext{font-size:15px;color:var(--ink-2)} .upnext b{color:var(--ink);font-weight:600}
.btn.big{min-height:56px;font-size:18px;width:100%;letter-spacing:.01em}
.exname{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline dotted var(--ink-3);text-underline-offset:4px}
.prow{display:flex;gap:8px;align-items:stretch} .prow .pick{flex:1;min-width:0}
.info{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:56px;font-size:13px;font-weight:600;color:var(--accent)}
.bodies{display:flex;gap:8px;justify-content:center}
.bodies figure{margin:0;flex:1;min-width:0;max-width:190px;text-align:center}
.bodies figcaption{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
svg.body{display:block;width:100%;height:auto}
.bbase{fill:var(--surface-2)}
.m{fill:var(--surface);stroke:var(--line);stroke-width:.8}
.m.p{fill:var(--accent);stroke:var(--accent)}
.m.s{fill:var(--accent);fill-opacity:.38;stroke:var(--accent);stroke-opacity:.55}
.keys{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--ink-2)}
.keys i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px;border:1px solid var(--accent)}
.keys i.p{background:var(--accent)} .keys i.s{background:var(--accent);opacity:.38}
ol.steps,ul.watch{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
ol.steps li::marker{font-weight:700;color:var(--accent)}
ul.watch li::marker{color:var(--warn)}
.mus{font-size:14px}.mus b{font-weight:600}
.dgm{margin:10px 0;padding:8px;border:1px solid var(--line,#ddd);border-radius:12px;background:var(--card,transparent)}
.dgm svg{width:100%;height:auto;display:block}
.dgm .fg{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.dgm .fg.far{opacity:.45}.dgm .fg.head{fill:var(--bg,transparent)}
.dgm .gnd{stroke:var(--line,#999);stroke-width:1.5;fill:none}
.dgm .eq{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dgm .eqf{fill:var(--accent);stroke:none}.dgm .eqbg{fill:var(--accent);opacity:.08}
.dgm .ar{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round}
.dgm .bad .fg{stroke:var(--warn)}
.dgm .dl{font-size:9.5px;text-anchor:middle;fill:var(--muted,currentColor)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand">Training Log</span><span id="sync" data-s="busy">Loading</span></div>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"><div></div></nav>
<div id="sheet"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const monday=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const fmtD=(s,o)=>pd(s).toLocaleDateString('en-US',o||{month:'short',day:'numeric'});
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const f1=v=>v==null||v===''?'':String(+(+v).toFixed(1));
const clone=o=>JSON.parse(JSON.stringify(o));
const tryJ=(f,d)=>{try{return f()}catch(e){return d}};

/* ---------- exercise library ---------- */
const TL={wr:'Weight × reps',br:'Reps only',tm:'Hold / time',wt:'Weight × time',cd:'Cardio (min + miles)'};
const FIELDS={wr:[['w','lb'],['r','reps']],br:[['r','reps']],tm:[['s','sec']],wt:[['w','lb'],['s','sec']],cd:[['m','min'],['d','mi']]};
const GROUPS=['Legs','Hinge & glutes','Push','Pull','Core','Mobility','Cardio'];
const J={k:'knee',e:'elbow',a:'ankle',s:'shoulder'};
// id, name, group, type, equipment, joints(k=knee,e=elbow), alternates
const LIB=[
['leg-press','Leg press','Legs','wr','Machine','k','hip-thrust,glute-bridge,leg-curl'],
['goblet-squat','Goblet squat','Legs','wr','Kettlebell','k','hip-thrust,glute-bridge,leg-curl'],
['leg-curl','Seated leg curl','Legs','wr','Machine','','glute-bridge,db-rdl'],

const GUIDE={
'leg-press':['quads,glutes','hamstrings,adductors',"Set the seat so your knees bend to about 90 degrees at the bottom, with your back and hips flat against the pad.|Place your feet shoulder width apart on the middle of the platform, toes turned out slightly.|Release the safety handles and lower the platform slowly over 2 to 3 seconds.|Press through your whole foot until your legs are nearly straight, then lower again.","Never lock your knees out at the top. Stop just short of straight.|Keep your hips and lower back flat on the pad. If your hips curl up, lower the platform less deep.|Keep your knees pointing the same way as your toes, not caving in.|Feet very low on the platform load the knees more. Feet very high shift the work to the glutes and hamstrings."],
'goblet-squat':['quads,glutes','adductors,hamstrings,abs',"Hold one kettlebell upright against your chest with both hands, elbows pointing down.|Stand with feet a little wider than your shoulders, toes turned out slightly.|Brace your core, sit down between your knees and keep your chest tall.|Go as deep as you can with your heels flat, then push the floor away to stand.","Keep your heels down. If they lift, squat to a bench or box instead.|Do not let your knees cave inward. Push them out over your toes.|Do not round your lower back at the bottom. Stop where you can keep it flat.|Start light. A bell you can lift for 10 clean reps is the right size."],
'leg-curl':['hamstrings','calves',"Adjust the seat and pad so the pad rests just above your heels and your knees line up with the machine's pivot.|Hold the handles and keep your back against the pad.|Curl your heels toward your glutes in a smooth 1 to 2 second pull.|Return slowly over 2 to 3 seconds until your legs are almost straight.","Do not swing or let your hips lift off the seat.|Use a weight you can control on the way back. Do not let the stack drop.|Stop if you feel a pinch behind the knee or a cramp. Lower the weight or the range."],
'leg-ext':['quads','hip-flexors',"Set the back so your knees line up with the pivot and the pad rests on your lower shins.|Sit tall and hold the handles.|Straighten your legs with control until they are almost straight, and squeeze your thighs for a moment.|Lower slowly over 2 to 3 seconds without letting the stack touch.","Go lighter than you think. Heavy leg extensions put a lot of strain across the knee.|Do not kick the weight up or snap the knees straight.|Skip this one if it causes pain in or around the kneecap, and use the leg curl or glute bridge instead."],
'calf-raise':['calves','',"Stand or sit with the balls of your feet on the platform and your heels hanging off.|Lower your heels slowly until you feel a stretch in your calves.|Press up onto your toes as high as you can and pause for a second.|Lower slowly and repeat.","Use the full range of motion. Short bouncy reps waste the work.|Keep your knees soft and your ankles straight. Do not roll to the outside of your feet.|Hold something for balance if you are standing."],
'split-squat':['quads,glutes','hamstrings,adductors,abs',"Stand in a long staggered stance with one foot forward and one back, holding dumbbells at your sides.|Keep your torso upright and your front foot flat.|Bend both knees and lower your back knee straight down toward the floor.|Press through the front foot to stand. Finish all reps, then switch legs.","The step should be long enough that your front knee stays roughly over your ankle.|Do not let the front knee cave in.|Hold a rack or wall with one hand if you wobble.|Shorten the depth or skip it if the front knee hurts."],
'step-up':['quads,glutes','hamstrings,calves',"Stand facing a sturdy bench or box about knee height, with dumbbells at your sides.|Place your whole front foot on the box.|Press through that heel to stand up, bringing the other foot up to meet it.|Step back down slowly, controlling the lowering, then repeat. Switch legs.","Let the leading leg do the work. Do not push off the back foot.|Pick a box height where you can keep your torso upright and your knee steady.|Take your time on the way down. That is where most of the control is."],
'db-rdl':['hamstrings,glutes','lower-back,adductors,traps',"Stand tall holding dumbbells in front of your thighs, feet hip width apart, knees slightly bent.|Push your hips straight back, as if closing a car door with your backside.|Slide the weights down your thighs with a flat back until you feel a stretch in the back of your legs, often around mid-shin.|Squeeze your glutes and drive your hips forward to stand tall.","Keep the weights close to your legs the whole way.|Keep your back flat. If it starts to round, stop lowering sooner.|Do not turn it into a squat. Your knees stay softly bent while your hips move back.|Look at a spot on the floor a few feet ahead and keep your neck neutral."],
'kb-deadlift':['glutes,hamstrings','quads,lower-back,forearms,traps',"Stand with feet hip width apart and the kettlebell on the floor between your feet, in line with your ankles.|Push your hips back, bend your knees and grab the handle with both hands, back flat and chest up.|Brace your core and push the floor away to stand tall, squeezing your glutes at the top.|Hinge back down with control and set the bell down. Do not drop it.","Keep your spine flat. Do not round to reach the bell. Raise it on a block or step if needed.|Do not lean back at the top. Stand tall and finish with your hips.|Keep the bell close to your body."],
'kb-swing':['glutes,hamstrings,lower-back','lats,mid-back,traps,delts-rear',"Stand with feet a little wider than your hips and the kettlebell a foot in front of you.|Hinge back and hike the bell between your legs, forearms touching your thighs.|Snap your hips forward hard and let the bell float to chest height. Your arms just guide it.|Let the bell fall back, hinge again and hike it behind you for the next rep.","It is a hip hinge, not a squat and not an arm lift.|Finish tall with your glutes tight. Do not lean back.|Learn the kettlebell deadlift first.|End the set when your form breaks down. Tired swings are how backs get tweaked."],
'hip-thrust':['glutes','hamstrings,quads,abs',"Sit on the floor with your upper back against a bench, knees bent and feet flat, about shoulder width apart.|Set the weight over your hips, or use the machine's pad or belt.|Press through your heels and drive your hips up until your body forms a straight line from shoulders to knees.|Squeeze your glutes at the top for a second, then lower with control.","Tuck your chin slightly and look forward, not up at the ceiling.|Do not over-arch your lower back at the top. Keep your ribs down.|Your shins should be about vertical at the top. Adjust your foot distance if your hamstrings take over."],
'glute-bridge':['glutes,lower-back','hamstrings,adductors,abs',"Lie on your back with knees bent and feet flat, hip width apart, arms at your sides.|Press through your heels and lift your hips until your shoulders, hips and knees form a line.|Squeeze your glutes at the top for 1 to 2 seconds.|Lower slowly and repeat.","Do not push into an arch in your lower back. Stop when your hips are level with your ribs.|Keep your knees pointing forward, not falling in.|If your hamstrings cramp, move your feet a little closer to your hips."],
'chest-press-machine':['chest,triceps','delts-front',"Set the seat so the handles are level with the middle of your chest.|Sit back with your shoulder blades pulled back and down against the pad.|Press the handles forward until your arms are almost straight.|Return slowly until your hands are back at chest level, then repeat.","Do not lock your elbows hard at the top.|Keep your shoulders down, away from your ears, and your back on the pad.|Keep your wrists straight.|If your elbows are sore, go lighter, use a neutral grip if the machine has one, or switch to the pec deck."],
'db-bench':['chest,triceps','delts-front,abs',"Sit on a flat bench with dumbbells on your thighs, then lie back and bring them to chest level.|Plant your feet flat and pull your shoulder blades together.|Press the dumbbells up until your arms are almost straight over your chest.|Lower slowly to the sides of your chest, with elbows about 45 degrees from your torso.","Do not flare your elbows straight out to the sides.|Start light, and ask for a spotter or hand-off when the weights get heavy.|Keep your wrists stacked over your elbows.|End the set if you cannot control the weight on the way down."],
'incline-pushup':['chest,triceps','delts-front,abs',"Place your hands on a bench or counter, a little wider than your shoulders.|Step back until your body forms a straight line from head to heels.|Lower your chest toward the edge, with your elbows about 45 degrees from your body.|Press back up until your arms are straight.","Keep your hips in line with your body, not sagging or piking.|Do not let your elbows flare out wide.|Use a lower surface for more challenge and a higher one for less."],
'db-shoulder-press':['delts-front,delts-side','triceps,traps',"Sit on a bench with back support, dumbbells at shoulder height, palms facing forward or toward each other.|Brace your core and keep your ribs down.|Press the weights overhead until your arms are almost straight.|Lower slowly to shoulder level.","Do not arch your lower back to get the weight up. Use a lighter pair.|Do not shrug your shoulders up to your ears.|Stay in a pain-free range. If your shoulder pinches, stop and use the lateral raise instead."],
'shoulder-press-machine':['delts-front,delts-side','triceps,traps',"Adjust the seat so the handles start at shoulder height.|Sit tall with your back on the pad and your core tight.|Press the handles up until your arms are almost straight.|Lower slowly back to shoulder height.","Do not lock your elbows out.|Keep your lower back against the pad.|Pick a weight where the last rep still looks like the first."],
'lateral-raise':['delts-side','traps',"Stand holding light dumbbells at your sides with a slight bend in your elbows.|Brace your core and keep your chest tall.|Raise your arms out to the sides until they reach shoulder height.|Lower slowly over 2 to 3 seconds.","Go lighter than you think. This is a small muscle.|Do not swing from your legs or shrug.|Do not lift above shoulder height. Lead with your elbows, not your hands."],
'pec-deck':['chest,delts-front','biceps',"Set the seat so the handles are at chest height, with your back against the pad.|Place your forearms or hands on the pads with your elbows slightly bent.|Squeeze your arms together in front of your chest.|Return slowly until you feel a light stretch across your chest, and no further.","Do not let the weight pull your arms back past your shoulders.|Keep your shoulders down and back.|Stay in a comfortable range if your shoulders are cranky."],
'triceps-pushdown':['triceps','forearms',"Stand facing a cable machine with a rope or bar at chest height, elbows tucked at your sides.|Keep your chest up and your core braced.|Press down until your arms are straight.|Let your hands rise slowly until your forearms are just past parallel. Your elbows stay pinned.","Keep your elbows still. If they drift forward, the weight is too heavy.|Do not lean over the bar to push it down.|If your elbows hurt, skip this exercise for now."],
'lat-pulldown':['lats','biceps,mid-back,delts-rear,forearms,traps',"Adjust the thigh pad so your legs are locked in, and grab the bar a little wider than your shoulders.|Sit tall and lean back slightly with your chest up.|Pull the bar down to the top of your chest by driving your elbows toward your hips.|Let the bar rise slowly until your arms are straight and you feel a stretch in your lats.","Do not pull the bar behind your neck.|Do not swing back to heave the weight down. Use less weight.|Think about pulling with your elbows, not your hands.|If your elbows are sore, try a neutral-grip handle."],
'seated-cable-row':['lats,mid-back','biceps,delts-rear,traps',"Sit with your feet on the platform, knees slightly bent, and grab the handle.|Sit tall with your chest up and a flat back.|Pull the handle to your lower ribs, squeezing your shoulder blades together.|Return slowly until your arms are straight, letting your shoulders drift forward a little.","Do not rock back and forth to move the weight.|Keep your shoulders down, not shrugged.|Keep your back flat. Do not round over as you return."],
'db-row':['lats,mid-back','biceps,delts-rear,forearms,lower-back',"Place one hand and the same-side knee on a bench, other foot on the floor, back flat.|Hold a dumbbell in your free hand with your arm hanging straight.|Pull the dumbbell toward your hip, with your elbow close to your body.|Lower slowly until your arm is straight. Finish your reps, then switch sides.","Keep your back flat and your hips level. Do not twist.|Pull with your back, not by jerking your arm or body.|Start with a weight you can pull for 10 smooth reps."],
'assisted-pullup':['lats,mid-back','biceps,traps,delts-rear,abs',"Set the assistance weight. More assistance makes it easier.|Grab the bar a little wider than your shoulders and kneel or stand on the platform.|Pull your chest toward the bar by driving your elbows down.|Lower slowly until your arms are straight.","Do not kick or swing. Lower the assistance gradually as you get stronger.|Start each rep with your shoulders pulled down, away from your ears.|If your elbows or shoulders are sore, use the lat pulldown instead."],
'face-pull':['delts-rear,mid-back','traps,biceps',"Set a rope on a cable at about chest or face height.|Hold the ends with your palms facing in and step back until the cable is tight.|Pull the rope toward your face, spreading the ends apart with your elbows high.|Return slowly with control.","Use a light weight. The goal is shoulder health and posture, not heavy load.|Do not lean back to pull.|Keep your elbows at or above the level of your wrists."],
'reverse-fly':['delts-rear,mid-back','traps',"Adjust the seat so the handles are at shoulder height, facing the pad with your chest against it.|Hold the handles with a slight bend in your elbows.|Open your arms out to the sides, squeezing your shoulder blades together.|Return slowly.","Keep the weight light and the movement smooth.|Do not shrug.|Do not let the weight stack bounce."],
'biceps-curl':['biceps','forearms',"Stand tall holding dumbbells at your sides, palms forward, elbows next to your ribs.|Curl the weights up toward your shoulders.|Squeeze at the top without swinging.|Lower slowly over 2 to 3 seconds until your arms are straight.","Keep your elbows pinned at your sides.|Do not swing your body to lift the weight.|If your elbows are sore, rest this exercise."],
'plank':['abs','obliques,lower-back,delts-front',"Place your forearms on the floor with your elbows under your shoulders and your legs straight behind you on your toes.|Squeeze your glutes and brace your abs as if bracing for a light punch.|Hold your body in a straight line from head to heels.|Breathe steadily and hold for the target time.","Do not let your hips sag or pike up.|End the set when your form breaks down.|Drop to your knees if needed. Lower back pain means stop.|Use a high plank on your hands if your elbows are sore."],
'dead-bug':['abs','obliques',"Lie on your back with your arms straight up and your knees bent over your hips at 90 degrees.|Press your lower back gently into the floor.|Lower your opposite arm and leg slowly toward the floor.|Return to the start and switch sides.","Keep your lower back pressed down the whole time. If it arches, shorten the range.|Move slowly. This is about control.|Breathe out as you extend."],
'bird-dog':['abs,lower-back','obliques,glutes,delts-front',"Start on hands and knees with your hands under your shoulders and your knees under your hips. Pad your knees if needed.|Brace your core and keep your back flat.|Reach one arm forward and the opposite leg back until both are in line with your body.|Pause, return, and switch sides.","Do not let your hips rotate or your back sag.|Move slowly. Do not reach higher than your body line.|Use a thicker mat or skip it if kneeling hurts your knees."],
'farmers-carry':['forearms,traps','abs,obliques,glutes,quads,hamstrings,calves,lower-back',"Stand between two heavy dumbbells or kettlebells. Hinge down and grab them with a firm grip.|Stand tall with your shoulders back and down and your core braced.|Walk with short, steady steps for the target time or distance.|Set the weights down carefully with a hinge. Do not drop them.","Do not lean or shrug. Stay tall.|Pick a weight you can carry with good posture.|Look ahead and keep an even pace.|Clear your path first."],
'pallof-press':['obliques,abs','delts-front',"Set a cable at chest height. Stand sideways to it, feet hip width apart, holding the handle at your chest with both hands.|Step away until the cable is tight and brace your core.|Press the handle straight out in front of you.|Hold for a second, then bring it back in. Finish your reps, then switch sides.","Do not let the cable pull you around. Resisting the twist is the point.|Keep your hips and shoulders square.|Breathe out as you press."],
'hip-flexor-stretch':['hip-flexors','quads',"Kneel on a mat on one knee with the other foot flat in front and the shin vertical. Pad the back knee.|Tuck your tailbone under and squeeze the glute of the back leg.|Shift your hips forward gently until you feel a stretch at the front of your back hip.|Hold and breathe slowly, then switch sides.","Do not arch your lower back. Tuck your tailbone instead.|The stretch should feel firm, not sharp.|Do it standing with your back foot on a step if kneeling hurts."],
'thoracic-rotation':['mid-back,obliques','',"Start on hands and knees with your hands under your shoulders and your knees under your hips.|Place one hand lightly behind your head.|Rotate that elbow down toward the opposite arm, then open up toward the ceiling.|Follow your elbow with your eyes. Repeat, then switch sides.","Rotate from your upper back, not your lower back.|Move slowly through a comfortable range.|Keep your hips steady."],
'hamstring-stretch':['hamstrings','calves',"Lie on your back with both legs straight. Lift one leg and hold behind the thigh, or loop a strap or towel around the foot.|Keep the other leg flat on the floor.|Straighten the lifted leg until you feel a stretch in the back of your thigh.|Hold, breathe, then switch.","Stretch gently. You should feel tension, not sharp pain.|Do not bounce.|Keep your hips on the floor, with a soft bend in the knee if needed."],
'calf-stretch':['calves','',"Stand facing a wall with your hands on it at chest height.|Step one foot back and keep its heel on the floor and the leg straight.|Bend your front knee and lean your hips toward the wall until you feel a stretch in the back calf.|Hold, then switch. Bend the back knee slightly to reach the lower calf.","Keep the back heel down and your toes pointing forward.|Do not bounce.|Stop if you feel pain in the heel or Achilles tendon."],
'cat-cow':['lower-back,abs','mid-back',"Start on hands and knees with your wrists under your shoulders and your knees under your hips.|Breathe in, drop your belly and lift your chest and tailbone (cow).|Breathe out, round your spine toward the ceiling and tuck your chin and tailbone (cat).|Move slowly between the two, one breath per position.","Move within a comfortable range.|Pad your knees if kneeling hurts.|Do not force the end positions."],
'pigeon-stretch':['glutes','hip-flexors',"Start on hands and knees. Slide one knee forward behind the same-side wrist, with the shin angled across your body.|Extend the other leg straight back.|Square your hips and gently lower your chest forward over the front leg.|Hold and breathe, then switch sides.","Put a folded towel or block under the front hip if it does not reach the floor.|Do not force the front knee. If it hurts, skip it and use the 90/90 or the hip flexor stretch.|The stretch should be in the hip and glute, not the knee."],
'ninety-ninety':['glutes,hip-flexors','adductors',"Sit on the floor with both knees bent at 90 degrees, one leg in front and the other out to the side.|Sit tall with your hands on the floor or crossed on your chest.|Rotate both knees over to the other side, switching the position of your legs.|Move slowly with control and repeat.","Sit on a cushion if your hips are tight.|Keep your spine tall.|Move gently. Do not force a knee down."],
'walk':['quads,calves,glutes','hamstrings',"Stand tall with your gaze ahead and your shoulders relaxed.|Take natural steps, landing on your heel and rolling through to your toes.|Swing your arms gently.|Pick a pace where you can talk but still feel a little warm, and build your time gradually.","Wear supportive shoes.|Slow down or shorten the walk if a joint flares up.|Choose flat, even ground when something feels sore."],
'incline-walk':['glutes,calves','quads,hamstrings',"Set the treadmill to a gentle incline, 3 to 8 percent, and a comfortable speed.|Walk tall without leaning on the handles.|Swing your arms naturally.|Build up your time before adding more incline.","Do not hold the handrails. It reduces the work and changes your posture.|Lower the incline if it strains your calves or knees.|Cool down by lowering the incline for the last few minutes."],
'bike':['quads','hamstrings,glutes,calves',"Adjust the seat so your knee has a slight bend at the bottom of the pedal stroke.|Sit tall with relaxed shoulders and a light grip.|Pedal at a steady pace with light resistance, then add resistance gradually.|Finish with a few easy minutes.","A seat set too low strains the knees.|Do not bounce on the saddle. Lower the resistance.|Stop if your knee hurts."],
'elliptical':['quads,glutes','hamstrings,calves',"Step on and hold the handles lightly.|Stand tall with your weight over your feet.|Push and pull in smooth, circular strides.|Choose a resistance you can sustain with good posture, and try reversing direction for variety.","Do not lean heavily on the handles.|Keep your knees tracking forward.|Keep your steps smooth. Slow down if you lose control."],
'world-greatest-stretch':["hip-flexors,glutes","hamstrings,mid-back,obliques","Start in a push-up position, or put your hands on a bench to make it easier.|Step one foot forward, outside your hand, into a lunge.|Drop the inside elbow toward the floor, then rotate that arm up to the ceiling and follow it with your eyes.|Put the hand down, straighten the front leg to stretch the hamstring, then step back and switch sides.","Move slowly and stay where it feels like a stretch, not a pinch.|Use a bench or chairs for your hands if the floor feels too far.|Pad the back knee, or keep it lifted off the floor."],
'leg-swings':["hip-flexors,hamstrings","glutes,adductors","Stand tall next to a wall or rail and hold on with one hand.|Swing one leg forward and back in a smooth, controlled arc with your torso upright.|After 10, face the wall and swing the same leg side to side across your body.|Switch legs.","Start small and let the range grow with each swing.|Do not kick or let your lower back arch.|Keep the standing knee soft."],
'arm-circles':["delts-front,delts-side","traps,delts-rear","Stand tall with your arms out to the sides at shoulder height.|Make small circles, about the size of a dinner plate, forward for 10 reps.|Gradually make them bigger, then reverse direction.","Keep your shoulders away from your ears.|Stay in a pain-free range.|Stop if you feel pinching at the top of the shoulder."],
'wall-slides':["traps,mid-back","delts-side","Stand with your back, hips and head close to a wall and your feet a few inches out.|Place your forearms on the wall with your elbows bent about 90 degrees.|Slide your arms up the wall as far as you can while keeping your ribs down and your forearms touching the wall.|Slide back down slowly.","Do not arch your lower back to reach higher.|Stop where your forearms start to leave the wall.|Pain at the front of the shoulder means use a smaller range."],
'doorway-chest-stretch':["chest","delts-front,biceps","Stand in a doorway and place one forearm on the frame with your elbow bent near shoulder height.|Step the same-side foot forward through the doorway until you feel a stretch across your chest.|Hold and breathe slowly, then switch arms.","Keep your ribs down and do not arch your back.|The stretch should be mild to moderate, never sharp or tingly.|Lower your elbow if the front of the shoulder pinches."],
'ankle-rocks':["calves","","Stand facing a wall with one foot about 4 inches from it, toes pointing forward.|Keeping your heel on the floor, bend your knee forward to touch the wall.|Return and repeat. Move the foot back an inch at a time to make it harder.|Switch feet.","Keep your heel down the whole time.|Stop at a stretch, not a pinch, at the front or back of the ankle.|Skip it while an ankle injury is fresh."],

function pickAlt(ex){for(const id of ex.alts||[]){const a=exById(id);if(a&&!conflict(a))return a}
  return exAll().find(e=>e.id!==ex.id&&e.group===ex.group&&!conflict(e))||null}
function suggestFor(ex,limit=3){const have=new Set(((cur()||{}).entries||[]).map(e=>e.ex)),seen=new Set([ex.id]),out=[];
  const add=a=>{if(a&&!seen.has(a.id)&&!have.has(a.id)&&!conflict(a)){seen.add(a.id);out.push(a)}};
  (ex.alts||[]).forEach(id=>add(exById(id)));
  exAll().filter(e=>e.group===ex.group).sort((a,b)=>(a.type===ex.type?0:1)-(b.type===ex.type?0:1)).forEach(add);
  return out.slice(0,limit)}

/* ---------- charts ---------- */
function niceTicks(lo,hi,n){if(lo===hi){lo-=1;hi+=1}const raw=(hi-lo)/n,mag=10**Math.floor(Math.log10(raw)),f=raw/mag;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag,a=Math.floor(lo/step+1e-9)*step,b=Math.ceil(hi/step-1e-9)*step,t=[];
  for(let v=a;v<=b+step/2;v+=step)t.push(+v.toFixed(6));return t}
function lineChart(host,pts,o={}){
  if(!pts.length){host.innerHTML='<p class="empty">Nothing logged here yet. This fills in as you add entries.</p>';return}
  const W=360,H=210,m={l:40,r:14,t:16,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b,unit=o.unit||'';
  const ys=pts.map(p=>p.y);if(o.goal!=null)ys.push(o.goal);(o.refs||[]).forEach(r=>ys.push(r.y));
  const lo=Math.min(...ys),hi=Math.max(...ys),pad=(hi-lo)*.15||Math.max(1,hi*.05);
  const ticks=niceTicks(lo-pad,hi+pad,4),y0=ticks[0],y1=ticks[ticks.length-1];
  const t0=pts[0].t,t1=pts[pts.length-1].t,X=t=>t1===t0?m.l+iw/2:m.l+(t-t0)/(t1-t0)*iw,Y=v=>m.t+ih-(v-y0)/(y1-y0)*ih;
  const xl=t1===t0?[[t0,'middle']]:[[t0,'start'],[(t0+t1)/2,'middle'],[t1,'end']];
  const lab=t=>new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  let g=ticks.map(v=>`<line class="c-grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="c-tick" x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${f1(v)}</text>`).join('');
  g+=xl.map(([t,a])=>`<text class="c-tick" x="${a==='start'?m.l:a==='end'?W-m.r:X(t)}" y="${H-8}" text-anchor="${a}">${lab(t)}</text>`).join('');
  if(o.goal!=null)g+=`<line class="c-goal" x1="${m.l}" x2="${W-m.r}" y1="${Y(o.goal)}" y2="${Y(o.goal)}"/><text class="c-goaltxt" x="${W-m.r}" y="${Y(o.goal)-5}" text-anchor="end">Goal ${f1(o.goal)}</text>`;
  g+=(o.refs||[]).map(r=>`<line class="c-goal" x1="${m.l}" x2="${W-m.r}" y1="${Y(r.y)}" y2="${Y(r.y)}"/><text class="c-goaltxt" x="${W-m.r}" y="${Y(r.y)-5}" text-anchor="end">${esc(r.label)}</text>`).join('');
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(p.t).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  g+=pts.length>1?`<path class="c-line" d="${d}"/>`:'';
  if(pts.length<=80)g+=pts.map(p=>`<circle class="c-dot" cx="${X(p.t)}" cy="${Y(p.y)}" r="${p===pts[pts.length-1]?5:3.5}"/>`).join('');
  g+=`<line class="c-cross" id="cx" y1="${m.t}" y2="${m.t+ih}" visibility="hidden"/><circle class="c-dot" id="hl" r="6" visibility="hidden"/>`;
  host.innerHTML=`<div class="readout"><b></b><span></span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Line chart')}">${g}</svg>`;
  const svg=host.querySelector('svg'),rb=host.querySelector('.readout b'),rs=host.querySelector('.readout span'),cx=svg.querySelector('#cx'),hl=svg.querySelector('#hl');
  const show=(p,hover)=>{rb.textContent=`${f1(p.y)} ${unit}`;rs.textContent=`${lab(p.t)}${p.tip?' · '+p.tip:''}`;
    if(hover){cx.setAttribute('x1',X(p.t));cx.setAttribute('x2',X(p.t));cx.setAttribute('visibility','visible');hl.setAttribute('cx',X(p.t));hl.setAttribute('cy',Y(p.y));hl.setAttribute('visibility','visible')}};
  show(pts[pts.length-1],false);
  const mv=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;let b=pts[0];for(const p of pts)if(Math.abs(X(p.t)-x)<Math.abs(X(b.t)-x))b=p;show(b,true)};
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);
}
function barChart(host,bars,o={}){
  const W=360,H=190,m={l:30,r:10,t:14,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b;

function entryHTML(e,ei){

   ${noteExHTML(e.ex)}

     ${TIMED[e.type]?`<button class="tick play" data-act="tstart:${ei}:${si}" aria-label="Start timer for set ${si+1}"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg></button>`:''}<button class="tick" data-act="tick:${ei}:${si}" aria-pressed="${!!s.ok}" aria-label="Set ${si+1} done">${CHECK}</button><button class="x" data-act="delset:${ei}:${si}" aria-label="Remove set ${si+1}">×</button></div>`).join('')}
   <div class="exfoot"><button class="link" data-act="addset:${ei}">Add set</button><button class="link" data-act="info:${esc(e.ex)}">How to</button>${TIMED[e.type]?`<button class="link" data-act="tstart:${ei}">Timer</button>`:''}<button class="link" data-act="swap:${ei}">Swap</button><button class="link bad" data-act="rm:${ei}">Remove</button></div></section>`}

   ${tableHTML(['Date','Sets'],hist.slice().reverse().slice(0,40).map(h=>[fmtD(h.d,{month:'short',day:'numeric',year:'numeric'}),h.tip]))}`:'<p class="empty">Log a workout and tick your sets. Your lift trends show up here.</p>'}</div>`;

  const hd=sessDates().filter(d=>S.sessions[d].watch&&S.sessions[d].watch.avg),hm=hrMax();

  const hcard=hd.length?`<div class="card"><h2>Heart rate</h2><p class="note" style="margin-bottom:4px">Average heart rate per workout${hm?`. Dashed lines mark the moderate (64%) and vigorous (77%) zones of a ${hm.v} bpm max`:''}.</p><div id="ch-h"></div>
   ${tableHTML(['Date','Workout','Avg bpm'],hd.slice().reverse().slice(0,40).map(d=>[fmtD(d,{month:'short',day:'numeric',year:'numeric'}),S.sessions[d].title,String(S.sessions[d].watch.avg)]))}</div>`:'';
  const mcard=mb.some(b=>b.v>0)?`<div class="card"><h2>Workout minutes</h2><p class="note" style="margin-bottom:4px">Minutes per week from workouts where you logged time. Dashed line: 150 minutes, the low end of the WHO weekly range for moderate activity.</p><div id="ch-m"></div>${tableHTML(['Week of','Minutes'],mb.slice().reverse().map(b=>[b.short,String(b.v)]))}</div>`:'';
  S._pw=Wr;S._ps=hist;S._pb=bars;S._psx=sx;

const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
function md(t){const out=[];let ul=null;for(const raw of String(t).split('\n')){const line=raw.trimEnd().replace(/^#+\s*/,''),m=line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
  if(m){if(!ul){ul=[];out.push(ul)}ul.push(m[1])}else{ul=null;if(line.trim())out.push(line)}}
  return out.map(x=>Array.isArray(x)?`<ul>${x.map(i=>`<li>${inl(i)}</li>`).join('')}</ul>`:`<p>${inl(x)}</p>`).join('')}
const FAQ=[
['My knee is sore. What should I do?','knee sore hurts hurt pain leg press squat lunge step',`- Turn on the Knee marker in the Log tab. New workouts then swap leg press, squats and lunges for hip thrusts, glute bridges and leg curls.
- Keep walking if it doesn't hurt while you do it.
- When you return, go lighter than before, slow the lowering, and shorten the range if the bottom position bothers you.
- Stop and get it checked if pain is sharp, keeps getting worse, or comes with swelling, locking or the knee giving way.`],
['My elbow is sore. What can I still do?','elbow tendon forearm pain sore press pull curl triceps grip',`- Turn on the Elbow marker. Pressing and pulling moves get flagged and swapped for lateral raises, pec deck, reverse fly and face pulls.
- Keep training legs, glutes, core and mobility as usual.
- When you return to pressing or pulling, use machines with a comfortable grip, lighter loads and 12 to 15 reps, and don't lock out hard.
- Stop and get it checked for sharp pain, numbness or tingling, or pain that wakes you up.`],
['How do I move from the leg press to squats?','leg press squat goblet kettlebell rack barbell progress move',`- Keep the leg press as your base. Add the goblet squat as a skill session, not a replacement.
- Hold one kettlebell at your chest, feet shoulder width, sit down between your knees, chest tall, heels flat.
- Start by sitting back to a bench or box so the depth is the same every rep. Use a weight you can do 10 clean reps with.
- When 3 sets of 10 feel easy, add a second weekly set of goblet squats, then move up in weight.`],
['When should I add weight?','add weight progress progressive overload heavier increase when more',`- Use double progression: pick a rep range like 8 to 12 and stay at one weight until every set reaches the top of the range.
- Then add a small jump: 2.5 to 5 lb for most lifts, smaller for shoulders and arms.
- The first sets at the new weight will drop back toward the bottom of the range. That's normal.
- The Log tab shows last time's numbers and nudges you when it's time to go up.`],
['How many sets and reps should I do?','sets reps how many volume much',`- Most lifts: 2 to 3 sets of 8 to 12 reps.
- Stop each set with 1 to 3 reps still in the tank. Hard, not grinding.
- 5 to 6 exercises covers a full-body session in 30 to 60 minutes.
- Core and mobility work can be shorter: 2 sets of holds or slow reps.`],
['How do I lose the last 10 lb and keep my muscle?','lose weight fat muscle deficit protein calories last pounds diet',`- Aim for 0.5 to 1 lb per week. Faster loss costs muscle.
- Keep lifting and keep trying to add reps or weight. That signals your body to keep the muscle.
- Protein of roughly 0.7 to 1 g per lb of your goal weight, spread over your meals, is a common target.
- Sleep 7 to 9 hours and add easy walks. They burn calories without hurting recovery.`],
['The scale is not moving.','scale stuck plateau stall weight not moving same flat',`- Weigh at the same time of day, and judge the trend over 2 to 3 weeks, not single days.
- Track your waist or how clothes fit. You can lose fat and gain muscle at the same weight.
- Salt, hard workouts and hormones swing water weight by a few pounds.
- If it's truly flat for 3 to 4 weeks with consistent habits, add two 20 minute walks or trim a small amount of daily food. Change one thing at a time.`],
['How do I do a dumbbell Romanian deadlift?','romanian rdl deadlift hinge dumbbell hamstring back',`- Stand tall with dumbbells at your thighs, soft knees, shoulders back.
- Push your hips back like closing a car door, keeping the weights close to your legs.
- Lower until you feel a stretch in the back of your thighs, with a flat back. That's usually mid-shin.
- Squeeze your glutes to stand. Start light. The weight you can control matters more than the weight you can lift.`],
['How do I do a kettlebell goblet squat or deadlift?','kettlebell goblet deadlift swing kb bell',`- Goblet squat: hold the bell at your chest, elbows inside your knees at the bottom, heels down.
- Kettlebell deadlift: bell between your feet, hips back, flat back, push the floor away.
- Brace your core before each rep and breathe out as you stand.
- Skip swings until the deadlift feels automatic. The swing is the same hinge, done fast.`],
['What should my warm-up be?','warm warmup warm-up stretch before start',`- 3 to 5 minutes of easy walking or the bike.
- 1 to 2 light sets of your first exercise.
- Hip flexor stretch and thoracic rotations if you sit a lot.
- Save long static stretches for after the workout.`],
['Give me a 10 minute mobility routine','mobility stretch stiff flexibility routine yoga mat flow',`- Cat-cow, 8 slow reps.
- Thoracic rotation, 8 each side.
- Hip flexor stretch, 30 seconds each side.
- 90/90 hip switches, 8 reps.
- Hamstring stretch, 30 seconds each side.
- Calf stretch, 30 seconds each side. Breathe slowly and never stretch into sharp pain.`],
['I only have 20 minutes today.','short time busy quick minutes walk skip missed lazy tired',`- A 20 minute walk counts. Log it with Walk or cardio in the Log tab.
- Or do a 20 minute lift: leg press, a push, a pull. 2 sets each.
- Don't double up the next day to make up for it. Just carry on with the next workout in the plan.
- Consistency over weeks matters more than any single session.`],
['Is soreness normal? How do I tell it from pain?','sore soreness doms pain normal ache injury',`- Dull, even soreness in the muscle that peaks a day or two after training is normal.
- Sharp, pinching or joint-line pain, pain that gets worse as you train, or numbness is not. Stop that exercise.
- Light movement and walking usually ease soreness faster than complete rest.
- Pain that lasts more than a week or two is worth showing a clinician.`],
['How many days a week, and what about rest?','days week rest recovery schedule split frequency',`- Three full-body days with a rest day between each (for example Mon, Wed, Fri) is plenty to build muscle.
- Days 4 and 5 can be walks, mobility or easy cardio.
- If you feel run down for several days in a row, take an extra rest day.
- The Log tab suggests the next day in the A, B, C rotation.`],
['What can I do at home with a mat, 5 lb dumbbells and a rope?','home dumbbells mat jump rope equipment travel hotel',`- Mat: glute bridges, dead bugs, bird dogs, planks and the mobility routine.
- 5 lb dumbbells: lateral raises, rows, curls and slow tempo Romanian deadlifts.
- Rope: 30 seconds on, 30 seconds off for 5 to 10 rounds.
- Add an incline push-up using a sturdy counter or couch.`],
['How do I use the jump rope safely?','jump rope jumping cardio rope weighted',`- Start with 20 to 30 seconds on and 30 to 60 seconds off.
- Small, low jumps, soft landings on the balls of your feet, wrists doing the turning.
- Skip it while the knee is resting. Walking or the bike are better swaps.`],
['I\u2019m new to free weights. How do I start safely?','free weights beginner learn form safe start light dumbbell spotter new',`- Learn each move with a very light weight, then add weight slowly.
- Mirror, or a short phone video from the side, shows more than you can feel.
- Use dumbbells and kettlebells before barbells. They're easier to bail out of.
- Pair each new free-weight move with the machine version you already know, then shift over week by week.`],
['How does the timer work?','timer stopwatch time hold plank seconds cardio minutes beep countdown',`- Exercises you time (holds like plank and stretches, carries, and cardio) have a blue play button on every set, and a Timer link under the exercise that starts the next unfinished set.
- Tap play for a 5 second get-ready countdown, then the clock runs and shows how many seconds are left to your goal. A beep sounds when you reach it.
- For holds marked each side, the timer beeps at the goal, gives you 3 seconds to switch sides, then times the second side.
- Pause if you need to reset your position. Tap Done and the time goes into that set and the set is ticked. Untick it if you stopped by mistake.
- The screen stays awake while it runs, and it keeps going if you switch tabs. Turn the beeps off with the Sound button.`],
['Warm-up, cooldown, or a mobility day?','warm up warmup cooldown mobility stretch stretching flexibility routine before after',`- Do all three, they do different jobs.

- Core finisher: about 6 minutes of dead bug, bird dog and planks, added to the end of any workout.
- A mobility + core day is a longer session of about 25 minutes. Use it on a rest day, or when you only have a little time and still want to move. It counts as an active day.
- Static stretches held alone before heavy lifting may reduce power, so save the long holds for afterward.`],
['My ankle is sore. What can I still do?','ankle sprain achilles sore pain foot calf jump rope walking',`- Turn on the Ankle marker. Calf raises, lunges, step-ups, jump rope, loaded carries and walking cardio get flagged and swapped for seated and lying work, plus the bike.

['My shoulder is sore. What can I still do?','shoulder rotator cuff sore pain overhead press push up pulldown row',`- Turn on the Shoulder marker. Overhead pressing, bench and chest presses, push-ups, pull-downs, rows and planks get flagged and swapped for leg, glute and core work, curls and triceps pushdowns.

['How do my notes change what the app suggests?','notes journal diary keywords suggest words sore tired easy rest',`- The app reads your journal and workout notes from the last two weeks, on this device only.

- Nothing changes until you tap a button. Turn this off in Me.`],
['What should my heart rate be during a workout?','heart rate bpm zone zones effort intensity max pulse watch too high too low',`- Zones are a share of your max heart rate. Moderate is about 64 to 76%, vigorous about 77 to 93%.
- For walking, biking and other cardio, moderate is the general-health target. You can talk but not sing.
- For lifting, the average is lower because you rest between sets. Roughly 50 to 70% is typical.
- Different groups draw the lines a little differently. The American Heart Association uses 50 to 70% for moderate and 70 to 85% for vigorous.
- Your max is estimated from age, so zones can be off by 10 bpm or more. If you know your real max, enter it in Me.
- Dizziness, chest pain or an unusually racing pulse that doesn't settle: stop and get it checked.`]
];

  case'impcancel':S.imp=null;S.impDone='';render(true);break;
  case'sfeel':cur().feel=cur().feel===+arg?null:+arg;saveSession(S.date);render(true);break;
  case'delsession':if(!S.confirmDel){S.confirmDel=true;render(true)}else{delete S.sessions[S.date];S.confirmDel=false;clearTimeout(timers[S.date]);pendingDates.delete(S.date);persist('sessions',S.date,null);render(true)}break;
  case'openadd':S.sheet={k:'add',q:'',g:'All'};renderSheet();break;
  case'swap':S.sheet={k:'swap',ei:+arg,q:'',g:'All'};renderSheet();break;
  case'closesheet':S.sheet=null;renderSheet();break;
  case'enter':S.entered=true;window.scrollTo(0,0);render(true);break;
  case'info':{const f=S.sheet&&(S.sheet.k==='add'||S.sheet.k==='swap'||S.sheet.k==='guide')?S.sheet:null;S.sheet={k:'info',id:arg,from:f};renderSheet();break}
  case'infoback':S.sheet=S.sheet.from;renderSheet();break;
  case'guide':S.sheet={k:'guide',q:'',g:'All'};renderSheet();break;
  case'addto':{const ex=exById(arg);if(ex&&cur()){cur().entries.push(mkEntry(ex.id,3,''));saveSession(S.date);S.sheet=null;renderSheet();S.tab='today';render(true);window.scrollTo(0,document.body.scrollHeight)}break}
  case'grp':S.sheet.g=arg;renderSheet();break;
  case'pick':{const ex=exById(arg);if(!ex)break;const sh=S.sheet;
    if(sh.k==='swap'){const old=cur().entries[sh.ei],n=mkEntry(ex.id,old.sets.length,old.target);n.from=old.from||old.name;
      n.sets=n.sets.map(s=>({...s,ok:false}));cur().entries[sh.ei]=n}
    else cur().entries.push(mkEntry(ex.id,3,''));
    S.sheet=null;renderSheet();saveSession(S.date);render(true);break}
  case'newcustom':S.sheet={k:'custom',from:S.sheet};renderSheet();break;
  case'savecustom':{const name=$('#cn').value.trim();if(!name){$('#cn').focus();break}
    const c={id:'c-'+Date.now().toString(36),name,group:$('#cg').value,type:$('#ct').value};S.custom.push(c);saveApp();
    const prev=S.sheet.from;S.sheet=null;renderSheet();
    if(prev&&cur()&&prev.k==='add'){cur().entries.push(mkEntry(c.id,3,''));saveSession(S.date)}render(true);break}
  case'delcustom':S.custom=S.custom.filter(c=>c.id!==arg);saveApp();render(true);break;
  case'range':S.range=arg;render(true);break;
  case'savew':{const v=num($('#wv').value),d=$('#wd').value||today();if(v==null||v<50||v>700){$('#wv').focus();break}
    S.weights[d]={lb:v,ts:Date.now()};persist('weights',d,S.weights[d]);render(true);break}
  case'delw':delete S.weights[arg];persist('weights',arg,null);render(true);break;
  case'dfeel':S.draft.feel=S.draft.feel===+arg?null:+arg;render(true);break;
  case'savediary':{const d=S.draft.date;if(!S.draft.text.trim()&&!S.draft.feel)break;S.days[d]={note:S.draft.text.trim(),feel:S.draft.feel,ts:Date.now()};persist('days',d,S.days[d]);render(true);break}
  case'deldiary':{const d=S.draft.date;delete S.days[d];persist('days',d,null);S.draft=null;render(true);break}
  case'editday':S.diaryDate=arg;S.draft=null;render(true);window.scrollTo(0,0);break;
  case'cask':{S.cq=$('#cq').value.trim();S.cres=faqMatch(S.cq);render(true);break}
  case'topic':S.cq=FAQ[+arg][0];S.cres=[+arg];render(true);window.scrollTo(0,0);break;
  case'savesetup':{const p=readProfile();S.profile=p;saveApp();const d=today();
    if(p.startLb&&!S.weights[d]){S.weights[d]={lb:p.startLb,ts:Date.now()};persist('weights',d,S.weights[d])}render(true);break}
  case'saveprofile':{S.profile=readProfile();saveApp();el.textContent='Saved';setTimeout(()=>{if(el.isConnected)el.textContent='Save profile'},1400);break}
  case'exp':exportCSV(arg);break}
});
function downloadFile(name,text,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function exportCSV(kind){const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  if(kind==='j'){S.lastBackup=Date.now();saveLocal();downloadFile(`training-log-backup-${today()}.json`,JSON.stringify({...snapshot(),exportedAt:new Date().toISOString()}),'application/json');render(true);return}
  let rows;
  if(kind==='w')rows=[['date','workout','exercise','set','weight_lb','reps','seconds','minutes','miles']].concat(sessDates().flatMap(d=>(S.sessions[d].entries||[]).flatMap(e=>okSets(e).map((s,i)=>[d,S.sessions[d].title,e.name,i+1,s.w??'',s.r??'',s.s??'',s.m??'',s.d??'']))));
  else if(kind==='h'){const m=hrMax();rows=[['date','workout','minutes','avg_bpm','peak_bpm','calories','avg_pct_of_max']].concat(sessDates().filter(d=>S.sessions[d].watch).map(d=>{const w=S.sessions[d].watch;return[d,S.sessions[d].title,w.dur??'',w.avg??'',w.max??'',w.kcal??'',m&&w.avg?Math.round(w.avg/m.v*100):'']}))}
  else rows=[['date','weight_lb']].concat(wArr().map(x=>[x.d,x.lb]));
  downloadFile(kind==='w'?'training-log-workouts.csv':kind==='h'?'training-log-heart-rate.csv':'training-log-weights.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')}
function importBackup(file){if(!file)return;const msg=$('#impmsg');
  file.text().then(txt=>{const d=JSON.parse(txt);if(!d||typeof d!=='object'||(!d.sessions&&!d.weights&&!d.days))throw new Error('bad');
    const ns=Object.keys(d.sessions||{}).length,nw=Object.keys(d.weights||{}).length;
    S.sessions={...S.sessions,...(d.sessions||{})};S.weights={...S.weights,...(d.weights||{})};S.days={...S.days,...(d.days||{})};
    const have=new Set(S.custom.map(c=>c.id));S.custom=[...S.custom,...(d.custom||[]).filter(c=>!have.has(c.id))];
    if(!S.profile&&d.profile)S.profile=d.profile;saveLocal();render(true);const m=$('#impmsg');if(m)m.textContent=`Restored ${ns} workouts and ${nw} weigh-ins.`})
  .catch(()=>{if(msg)msg.textContent='That file does not look like a Training Log backup.'})}

/* ---------- boot ---------- */
setSync('load');render(true);loadLocal();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
